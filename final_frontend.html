<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>CodeQuest Crystal Caverns</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
#game{position:relative;width:100vw;max-width:480px;margin:0 auto;height:100vh;max-height:800px;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.clickable{pointer-events:auto}
.hud{position:absolute;top:0;left:0;right:0;padding:4px 6px;display:flex;gap:3px;flex-wrap:wrap;font-size:10px;font-weight:bold}
.hud .chip{background:rgba(0,0,0,0.65);padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px)}
.hud .chip.hp{flex:1;min-width:70px}
.hp-mini{width:55px;height:4px;background:#333;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:3px}
.hp-mini-fill{height:100%;background:#2ecc71;transition:width .4s}
.hp-mini-fill.low{background:#e74c3c}
.hp-mini-fill.mid{background:#f39c12}
.hud2{position:absolute;top:24px;left:0;right:0;padding:0 6px;display:flex;gap:3px;flex-wrap:wrap;font-size:10px;font-weight:bold}
.hud2 .chip{background:rgba(0,0,0,0.65);padding:2px 7px;border-radius:5px}
.hud .chip{background:rgba(0,0,0,0.6);padding:3px 8px;border-radius:14px;font-size:0.72em;font-weight:bold;border:1px solid rgba(255,255,255,0.08)}
.barwrap{position:absolute;left:6px;right:6px;top:48px;display:flex;align-items:center;gap:6px;font-size:9px;font-weight:bold}
.barlabel{width:20px;color:#69f0ae;text-shadow:0 1px 2px #000}
.bar{position:relative;flex:1;height:13px;background:rgba(0,0,0,0.6);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.barfill{height:100%;background:linear-gradient(90deg,#2ecc71,#38ef7d);transition:width .4s;border-radius:7px}
.barfill.mid{background:linear-gradient(90deg,#f39c12,#f1c40f)}
.barfill.low{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}
.bar.xp{height:10px}
.barfillx{height:100%;background:linear-gradient(90deg,#7c4dff,#b388ff);transition:width .4s;border-radius:7px}
.barnum{width:auto;color:#ccc;text-shadow:0 1px 2px #000;min-width:54px;text-align:right}
.panel{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(8,8,24,0.95);border-radius:12px;padding:10px;border:1px solid rgba(100,100,255,0.15);backdrop-filter:blur(8px)}
.panel.title-screen{top:50%;transform:translateY(-50%);bottom:auto;text-align:center;background:linear-gradient(160deg,rgba(20,12,45,0.92),rgba(8,8,24,0.95));border:1px solid rgba(124,77,255,0.35);box-shadow:0 0 40px rgba(124,77,255,0.25)}
.game-logo{font-size:1.7em;font-weight:bold;margin:0 0 2px;background:linear-gradient(90deg,#4dd0e1,#b388ff,#ff8a80);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;animation:logopulse 2.4s ease-in-out infinite}
@keyframes logopulse{0%,100%{filter:drop-shadow(0 0 6px rgba(124,77,255,0.5));transform:scale(1)}50%{filter:drop-shadow(0 0 18px rgba(124,77,255,0.9));transform:scale(1.03)}}
.game-tag{font-size:0.78em;color:#80deea;margin-bottom:10px;letter-spacing:2px;text-transform:uppercase}
.diff-row{display:flex;gap:5px;margin:6px 0}
.diff-btn{flex:1;padding:9px 4px;border-radius:9px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#ccc;font-size:0.72em;font-weight:bold;cursor:pointer;transition:all .15s}
.diff-btn.sel{border-color:#7c4dff;background:rgba(124,77,255,0.25);color:#fff;box-shadow:0 0 12px rgba(124,77,255,0.4)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.82em;color:#ddd;margin:6px 0}
.btn-begin{background:linear-gradient(135deg,#00f260,#0575E6);color:#fff;font-size:1.05em;padding:14px;box-shadow:0 4px 16px rgba(5,117,230,0.4)}
.panel h2{font-size:1.1em;margin-bottom:6px;color:#4dd0e1}
.panel p{font-size:0.8em;color:#888;margin-bottom:6px;line-height:1.4}
.panel input,.panel select{width:100%;padding:10px;border-radius:8px;border:2px solid #333;background:rgba(0,0,0,0.5);color:#fff;font-size:0.95em;margin:3px 0}
.panel input:focus{border-color:#0575E6;outline:none}
.btn{display:block;width:100%;padding:11px;border:none;border-radius:10px;font-size:0.95em;font-weight:bold;cursor:pointer;margin:3px 0;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#00f260,#0575E6);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
.btn-success{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
.btn-secondary{background:rgba(255,255,255,0.1);color:#ccc}
.spell-row{display:flex;gap:6px;margin:4px 0}
.class-row{display:flex;gap:5px;margin:4px 0;flex-wrap:wrap}.class-btn{flex:1;min-width:64px;border:2px solid #555;border-radius:8px;padding:5px 3px;background:rgba(255,255,255,0.05);text-align:center}.class-btn.sel{background:rgba(255,255,255,0.18);box-shadow:0 0 8px rgba(255,213,79,0.5)}.btn-special{background:rgba(255,213,79,0.12)}
.spell-btn{flex:1;border:2px solid #555;border-radius:10px;padding:5px 3px;background:rgba(255,255,255,0.05);text-align:center;cursor:pointer;transition:transform .1s}
.spell-btn.sel{transform:scale(1.04);box-shadow:0 0 10px rgba(255,255,255,0.3)}
.math-box{text-align:center;margin:6px 0}
.math-cat{font-size:0.72em;color:#82b1ff;margin-bottom:2px}
.math-q{font-size:1.25em;font-weight:bold}
.code-block{background:rgba(0,0,0,0.5);border-radius:8px;padding:8px;margin:5px 0;font-family:monospace;font-size:0.9em;color:#80cbc4}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}
.shop-item{background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:transform .2s}
.shop-item:active{transform:scale(.95)}
.shop-item .nm{font-size:0.75em;color:#ddd}
.shop-item .pr{font-size:0.7em;color:#ffd54f}
.msg{padding:7px;border-radius:8px;margin:5px 0;font-weight:bold;text-align:center;font-size:0.78em}
.msg-info{background:rgba(100,100,255,0.15);color:#82b1ff}
.msg-hit{background:rgba(0,255,100,0.15);color:#69f0ae}
.msg-miss{background:rgba(255,50,50,0.15);color:#ff8a80}
.msg-victory{background:rgba(255,215,0,0.15);color:#ffd54f}
.msg-defeat{background:rgba(255,50,50,0.25);color:#ff8a80}
.msg-treasure{background:rgba(255,215,0,0.15);color:#ffd54f}
.story-box{background:rgba(100,80,150,0.12);border-radius:8px;padding:7px;margin:4px 0;border-left:3px solid #7c4dff}
.story-t{font-size:0.82em;font-weight:bold;color:#b39ddb}
.story-x{font-size:0.7em;color:#9fa8da;font-style:italic;line-height:1.3}
</style>
</head>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
let W=480,H=800;
let SID=null,state=null,lastState=null;
let selSpell=0;
let storyScene=0;
let lastStoryStage=0;
let particles=[],dmgNums=[],shakeTime=0,shakeMag=0,flashColor=null,flashAlpha=0;
let pHitFlash=0;
let badges={};let badgeMsg='';let badgeMsgLife=0;
let animTime=0,gameMode='title';
let selDiff='normal';
let selClass='knight';
let bestRun={rooms:0,level:1};
let savedSID=null;
let settings={music:false,sfx:true,reducedMotion:false};
let showSettings=false;
let showHelp=false;
let showHint=false;
let roomTrans=0,roomTransDir=1;
let attackAnim=0,attackAnimWho=null;
let chestAnim=0,chestOpen=false;
let bossIntro=0;
let bgOffset=0;
let monsterDeath=0;
let lowHpPulse=0;
let levelUpText="";
let levelUpTextLife=0;
let hitStop=0;
let victoryTime=0;
let streakFire=[];
let goldRain=[];
let attackTrail=[];
let spearTrails=[];
let depth=0;

// === SOUND ENGINE (Web Audio API, no files needed) ===
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(freq,dur,type='square',vol=0.15){
  if(!audioCtx||!settings.sfx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
// === AMBIENT SOUNDTRACK (muted by default; toggle with 🔊) ===
let musicOn=false, musicNodes=null, currentMusicBiome='cavern';
function startMusic(biome){try{
  if(!audioCtx)return;
  if(musicNodes)stopMusic();
  const b=biome||currentMusicBiome||'cavern';
  const notes=b==='ruins'?[130.81,196.0]:[110.0,130.81]; // ruins: bright C major-ish; cavern: darker A minor-ish
  const pad=audioCtx.createGain();pad.gain.value=0.0;pad.connect(audioCtx.destination);
  const o1=audioCtx.createOscillator();o1.type='sine';o1.frequency.value=notes[0];
  const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=notes[1];
  const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.07;
  const lfoG=audioCtx.createGain();lfoG.gain.value=0.018;lfo.connect(lfoG);lfoG.connect(pad.gain);
  o1.connect(pad);o2.connect(pad);
  o1.start();o2.start();lfo.start();
  pad.gain.linearRampToValueAtTime(0.05,audioCtx.currentTime+2);
  musicNodes={pad,o1,o2,lfo};currentMusicBiome=b;
}catch(e){}}
function setMusicBiome(b){if(!b||b===currentMusicBiome)return;if(musicOn){startMusic(b);}else{currentMusicBiome=b;}}
function stopMusic(){if(musicNodes){try{musicNodes.pad.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);}catch(e){} musicNodes=null;}}
function toggleMusic(){settings.music=!settings.music;musicOn=settings.music;if(musicOn){initAudio();startMusic(curBiome);}else stopMusic();saveSettings();render();}
function saveSettings(){try{localStorage.setItem('cq_settings',JSON.stringify(settings));}catch(e){}}
function loadSettings(){try{const s=localStorage.getItem('cq_settings');if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){settings=Object.assign({music:false,sfx:true,reducedMotion:false},o);musicOn=settings.music;}}else{musicOn=settings.music;}}catch(e){}}
function toggleSetting(k){settings[k]=!settings[k];if(k==='music'){musicOn=settings.music;if(musicOn){initAudio();startMusic();}else stopMusic();}saveSettings();render();}
function sfxHit(){beep(800,0.08,'sawtooth',0.2);setTimeout(()=>beep(400,0.1,'sawtooth',0.15),60)}
function sfxHurt(){beep(200,0.15,'sawtooth',0.25);setTimeout(()=>beep(150,0.2,'sawtooth',0.2),80)}
function sfxCorrect(){beep(523,0.08,'sine',0.2);setTimeout(()=>beep(659,0.08,'sine',0.2),80);setTimeout(()=>beep(784,0.12,'sine',0.2),160)}
function sfxWrong(){beep(200,0.1,'square',0.15);setTimeout(()=>beep(150,0.15,'square',0.12),100)}
function sfxVictory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'sine',0.2),i*80))}
function sfxTreasure(){[659,784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.08,'triangle',0.15),i*60))}
function sfxLevelUp(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'triangle',0.2),i*50))}
function sfxDeath(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.2),i*100))}
// === HAPTICS (mobile vibration; no-op on desktop) ===
function vibe(p){try{if(navigator&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function sfxHit(){beep(800,0.08,'sawtooth',0.2);setTimeout(()=>beep(400,0.1,'sawtooth',0.15),60);vibe(25)}
function sfxHurt(){beep(200,0.15,'sawtooth',0.25);setTimeout(()=>beep(150,0.2,'sawtooth',0.2),80);vibe([40,30,40])}
function sfxCorrect(){beep(523,0.08,'sine',0.2);setTimeout(()=>beep(659,0.08,'sine',0.2),80);setTimeout(()=>beep(784,0.12,'sine',0.2),160);vibe(15)}
function sfxWrong(){beep(200,0.1,'square',0.15);setTimeout(()=>beep(150,0.15,'square',0.12),100);vibe(60)}
function sfxVictory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'sine',0.2),i*80));vibe([30,40,30,60])}
function sfxTreasure(){[659,784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.08,'triangle',0.15),i*60));vibe(40)}
function sfxLevelUp(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'triangle',0.2),i*50));vibe([20,30,20,30,50])}
function sfxDeath(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.2),i*100));vibe([100,60,100,200])}
function sfxBoss(){[100,80,60,40].forEach((f,i)=>setTimeout(()=>beep(f,0.3,'sawtooth',0.25),i*200));vibe([80,40,80,40,200])}
function sfxFootstep(){beep(80+Math.random()*20,0.03,'square',0.05)}
function sfxShop(){beep(880,0.06,'sine',0.15);setTimeout(()=>beep(1100,0.06,'sine',0.1),50)}

function resize(){const r=document.getElementById('game').getBoundingClientRect();W=r.width;H=r.height;cv.width=W;cv.height=H}
window.addEventListener('resize',resize);resize();
let torchFlicker=[];
for(let i=0;i<6;i++)torchFlicker.push(0.7+Math.random()*0.3);

// === ANIMATED SPRITE DRAWING ===

function drawPlayer(x,y,scl,hit,attacking,heroClass){
  ctx.save();ctx.translate(x,y);ctx.scale(scl,scl);
  const breathe=Math.sin(animTime*2.5)*1.5;
  ctx.translate(0,breathe);
  if(hit){ctx.translate(Math.sin(animTime*60)*6,0);ctx.filter='brightness(2.2) saturate(2)'}
  const lunge=attacking?Math.sin(Math.min(attackAnim,1)*Math.PI)*10:0;
  ctx.translate(lunge,0);
  // Cape (flowing cloth with sine wave)
  ctx.fillStyle='#23408f';
  ctx.beginPath();
  ctx.moveTo(-5,-20);
  for(let i=0;i<=6;i++){const t=i/6;const wy=-20+t*34;const wx=-6 - Math.sin(animTime*4+t*3)*4 - t*4;ctx.lineTo(wx,wy);}
  for(let i=6;i>=0;i--){const t=i/6;const wy=-20+t*34;const wx=-2 - Math.sin(animTime*4+t*3+1)*3;ctx.lineTo(wx,wy);}
  ctx.closePath();ctx.fill();
  // class theme
  const HC=heroClass||'knight';
  const THEME={knight:{cape:'#23408f',body:'#2e86de',body2:'#1b4f9c',metal:'#b0b8c0',metal2:'#8a929a',accent:'#ffd54f'},
    mage:{cape:'#3a1a6b',body:'#8b5cf6',body2:'#5b21b6',metal:'#c4b5fd',metal2:'#7c3aed',accent:'#fef08a'},
    ranger:{cape:'#14532d',body:'#22c55e',body2:'#15803d',metal:'#a3e635',metal2:'#4d7c0f',accent:'#bbf7d0'},
    healer:{cape:'#0c4a6e',body:'#06b6d4',body2:'#0e7490',metal:'#67e8f9',metal2:'#0891b2',accent:'#a5f3fc'}}[HC]||{cape:'#23408f',body:'#2e86de',body2:'#1b4f9c',metal:'#b0b8c0',metal2:'#8a929a',accent:'#ffd54f'};
  ctx.fillStyle=THEME.cape;
  ctx.beginPath();
  ctx.moveTo(-5,-20);
  for(let i=0;i<=6;i++){const t=i/6;const wy=-20+t*34;const wx=-6 - Math.sin(animTime*4+t*3)*4 - t*4;ctx.lineTo(wx,wy);}
  for(let i=6;i>=0;i--){const t=i/6;const wy=-20+t*34;const wx=-2 - Math.sin(animTime*4+t*3+1)*3;ctx.lineTo(wx,wy);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.moveTo(-5,-20);ctx.lineTo(-10,-2);ctx.lineTo(-4,8);ctx.lineTo(-2,-18);ctx.fill();
  // Legs
  ctx.fillStyle='#3a2a1a';
  ctx.fillRect(-5,6,4,12);ctx.fillRect(2,6,4,12);
  ctx.fillStyle='#5a3a1a';ctx.fillRect(-6,16,6,3);ctx.fillRect(1,16,6,3);
  // Body / tunic
  const bg=ctx.createLinearGradient(0,-18,0,8);bg.addColorStop(0,THEME.body);bg.addColorStop(1,THEME.body2);
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(-7,-16);ctx.lineTo(7,-16);ctx.lineTo(5,8);ctx.lineTo(-5,8);ctx.closePath();ctx.fill();
  // Belt
  ctx.fillStyle='#caa14a';ctx.fillRect(-7,2,14,3);
  // Arms
  ctx.fillStyle=THEME.body;ctx.fillRect(-9,-14,3,10);ctx.fillRect(6,-14,3,10);
  // Head
  ctx.fillStyle='#ffcc99';ctx.beginPath();ctx.arc(0,-22,6,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-2,-23,1.3,0,Math.PI*2);ctx.arc(2.5,-23,1.3,0,Math.PI*2);ctx.fill();
  // Helmet
  ctx.fillStyle=THEME.metal;ctx.beginPath();ctx.arc(0,-23,6.5,Math.PI,0);ctx.lineTo(6,-21);ctx.lineTo(-6,-21);ctx.closePath();ctx.fill();
  ctx.fillStyle=THEME.metal2;ctx.fillRect(-6,-21,12,2);
  ctx.fillStyle=THEME.accent;ctx.fillRect(-1,-30,2,7);
  // class-specific weapon
  ctx.save();
  const sw=attacking?-Math.sin(Math.min(attackAnim,1)*Math.PI)*1.2:0;
  if(HC==='mage'||HC==='healer'){
    ctx.translate(9,-6);ctx.rotate(sw*0.6-0.2);
    ctx.fillStyle='#6b4423';ctx.fillRect(-1.5,-2,3,14);
    ctx.fillStyle=HC==='mage'?'#a78bfa':'#67e8f9';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(0,-8,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    if(HC==='healer'){ctx.fillStyle='#a5f3fc';ctx.fillRect(-1,-10,2,6);}
  }else if(HC==='ranger'){
    ctx.translate(10,-4);ctx.rotate(sw*0.4);
    ctx.strokeStyle='#8a5a2a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,12,-0.9,0.9);ctx.stroke();
    ctx.strokeStyle='#a3e635';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(18,0);ctx.stroke();
  }else{
    ctx.translate(9,-8);ctx.rotate(sw-0.3);
    ctx.fillStyle='#7a5a2a';ctx.fillRect(-1.5,-2,3,8);
    const bl=ctx.createLinearGradient(0,-22,0,-2);bl.addColorStop(0,'#fff');bl.addColorStop(0.5,'#cfd8e0');bl.addColorStop(1,'#9aa3ad');
    ctx.fillStyle=bl;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(3,-16);ctx.lineTo(0,-14);ctx.lineTo(-3,-16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8eef4';ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(1.5,-16);ctx.lineTo(0,-15);ctx.lineTo(-1.5,-16);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // Knight shield
  if(HC==='knight'){ctx.fillStyle=THEME.metal;ctx.strokeStyle=THEME.accent;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-12,-8);ctx.lineTo(-7,-10);ctx.lineTo(-5,2);ctx.lineTo(-9,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=THEME.accent;ctx.fillRect(-9,-4,3,3);}
  // class sigil on chest
  ctx.fillStyle=THEME.accent;ctx.beginPath();ctx.arc(0,-4,3,0,Math.PI*2);ctx.fill();
  if(HC==='mage'){ctx.fillStyle='#1b1030';ctx.beginPath();ctx.arc(0,-4,1.4,0,Math.PI*2);ctx.fill();}
  else if(HC==='ranger'){ctx.fillStyle='#0a3d1a';ctx.fillRect(-1.5,-5.5,3,3);}
  else if(HC==='healer'){ctx.fillStyle='#063b46';ctx.fillRect(-0.8,-5.2,1.6,1.6);ctx.fillRect(-0.8,-3.4,1.6,1.6);}
  if(hit)ctx.filter='none';
  ctx.restore();
}

function drawMonster(x,y,scl,type,hit,attacking,phase){
  ctx.save();ctx.translate(x,y);ctx.scale(scl,scl);
  const bob=Math.sin(animTime*1.5+1)*3;
  ctx.translate(0,bob);
  if(hit){ctx.translate(Math.sin(animTime*50)*5,0);ctx.filter='brightness(2.2) saturate(2)'}
  if(attacking){ctx.translate(-Math.sin(Math.min(attackAnim,1)*Math.PI)*14,0)}
  const t=(type||'slime').toLowerCase();
  if(t.includes('slime')){

// === BACKGROUND SCENES ===

function drawCavernBg(){
  let depth=state?Math.min(7,Math.floor(state.rooms_cleared/3)):0;
  curBiome=depth>=3?'ruins':'cavern';
  setMusicBiome(curBiome);
  const palettes=[
    ['#0a0a2a','#1a1a4e','#0a0a1a'],['#0a1a0a','#1a3a10','#0a0f0a'],
    ['#1a0a2a','#3a1050','#0f0010'],['#0a1a2a','#003040','#000510'],
    ['#1a0000','#3a0000','#1f0000'],['#0a001a','#200040','#100010'],
    ['#001a0a','#103a10','#000500'],['#1a1000','#3a2000','#1f0500']];
  const p=palettes[depth]||palettes[7];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p[0]);g.addColorStop(0.5,p[1]);g.addColorStop(1,p[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // FAR layer: parallax mountain/crystal silhouettes (slow)
  ctx.save();
  const farOff=(bgOffset*0.15)%W;
  ctx.globalAlpha=0.35;
  ctx.fillStyle=p[0];
  for(let i=-1;i<5;i++){
    const bx=i*W/3 - farOff;
    ctx.beginPath();ctx.moveTo(bx,H*0.45);
    ctx.lineTo(bx+W/6,H*0.30);ctx.lineTo(bx+W/3,H*0.45);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // MID layer: floating crystal clusters (medium parallax) + glow
  ctx.save();
  const midOff=(bgOffset*0.4)%W;
  const cset=[['#4dd0e1','#ce93d8','#80cbc4','#7c4dff','#ffd54f'],['#a5d6a7','#ffab91','#80cbc4','#ce93d8','#fff59d'],['#ce93d8','#b39ddb','#9fa8da','#7986cb','#d1c4e9'],['#4fc3f7','#4dd0e1','#80deea','#b2ebf2','#e0f7fa'],['#ff8a80','#ffab91','#ffcc80','#ffe0b2','#fff3e0'],['#b39ddb','#ce93d8','#e1bee7','#f3e5f5','#f8bbd0'],['#a5d6a7','#81c784','#66bb6a','#4caf50','#388e3c'],['#ff8a80','#ffab91','#ffcc80','#ffe0b2','#ffecb3']];
  const c=cset[depth%cset.length];
  const cl=[[0.08,0.55,10,c[0]],[0.30,0.48,7,c[1]],[0.55,0.6,9,c[2]],[0.78,0.5,6,c[3]],[0.92,0.62,8,c[4]]];
  for(const[cx,cy,sz,col]of cl){
    let x=((W*cx - midOff)%(W+40));if(x<-20)x+=W+40;
    const y=H*cy;const glow=0.3+Math.sin(animTime+cx*10)*0.15;
    ctx.globalAlpha=glow*0.3;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-sz/2,sz*1.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=glow;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x-sz/2,y);ctx.lineTo(x+sz/2,y);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // NEAR layer: stalactites from top + stalagmites from floor (fast parallax)
  ctx.save();
  const nearOff=(bgOffset*0.8)%(W+40);
  let stColor='rgba(30,20,60,0.5)',stCount=8;
  switch(depth){case 0:stColor='rgba(30,20,60,0.5)';stCount=8;break;case 1:stColor='rgba(20,50,20,0.5)';stCount=10;break;case 2:stColor='rgba(40,20,60,0.5)';stCount=6;break;case 3:stColor='rgba(20,40,60,0.5)';stCount=12;break;case 4:stColor='rgba(50,20,20,0.5)';stCount=9;break;case 5:stColor='rgba(40,10,60,0.5)';stCount=7;break;case 6:stColor='rgba(30,60,30,0.5)';stCount=11;break;case 7:stColor='rgba(60,40,20,0.5)';stCount=8;break;}
  ctx.fillStyle=stColor;
  for(let i=0;i<stCount;i++){
    const x=((i*W/stCount - nearOff)%(W+40));let xx=x;if(xx<-20)xx+=W+40;
    const h=14+Math.sin(i*1.7+bgOffset*0.03)*10;
    ctx.beginPath();ctx.moveTo(xx-7,H*0.22);ctx.lineTo(xx+7,H*0.22);ctx.lineTo(xx+2,H*0.22+h);ctx.lineTo(xx-2,H*0.22+h);ctx.fill();
  }
  ctx.restore();

  // Wall torches (flicker + light pools)
  drawTorches();

  // Floor + near floor spikes
  const flC=['rgba(15,10,30,0.6)','rgba(10,20,15,0.6)','rgba(20,10,30,0.6)','rgba(10,15,35,0.6)','rgba(30,10,15,0.6)','rgba(20,10,35,0.6)','rgba(10,30,15,0.6)','rgba(30,20,10,0.6)'];
  ctx.fillStyle=flC[depth%flC.length];ctx.fillRect(0,H*0.7,W,H*0.3);
  const smC=['rgba(25,20,40,0.4)','rgba(20,30,25,0.4)','rgba(30,20,40,0.4)','rgba(20,30,45,0.4)','rgba(40,20,25,0.4)','rgba(30,20,45,0.4)','rgba(20,40,25,0.4)','rgba(40,30,25,0.4)'];
  ctx.fillStyle=smC[depth%smC.length];
  for(let i=0;i<8;i++){const x=((i*W/8 - bgOffset*0.5)%(W+20));let sx=x;if(sx<-10)sx+=W+20;const h=3+Math.sin(i*1.3)*2;ctx.beginPath();ctx.moveTo(sx,H*0.7);ctx.lineTo(sx+8,H*0.7);ctx.lineTo(sx+4,H*0.7+h);ctx.lineTo(sx-4,H*0.7+h);ctx.fill()}

  // Glowing crystals (foreground sparkle)
  for(const[cx,cy,sz,col]of [[0.1,0.6,8,c[0]],[0.85,0.55,6,c[1]],[0.2,0.75,5,c[2]],[0.7,0.8,7,c[3]],[0.5,0.5,4,c[4]]]){
    const x=W*cx,y=H*cy;const glow=0.3+Math.sin(animTime+cx*10)*0.15;
    ctx.globalAlpha=glow;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x-sz/2,y);ctx.lineTo(x+sz/2,y);ctx.closePath();ctx.fill();
    ctx.globalAlpha=glow*0.3;ctx.beginPath();ctx.arc(x,y-sz/2,sz*1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // LIVING WORLD: roaming critters behind actors
  if(!settings.reducedMotion){drawBiome();drawCritters();}

  // Floating dust
  for(let i=0;i<25;i++){
    const px=(i*37+animTime*15)%(W+20)-10;
    const py=(i*53+animTime*8)%H;
    const pa=0.15+Math.sin(animTime+i)*0.1;
    ctx.globalAlpha=pa;ctx.fillStyle='rgba(180,180,255,1)';ctx.beginPath();ctx.arc(px,py,1.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Weather: drifting fog + rising embers
  if(!settings.reducedMotion)drawWeather();
  // Day/night mood grade (cosmetic)
  drawDayNight();
}

function drawRoomTransition(){
  if(roomTrans<=0)return;
  ctx.fillStyle=`rgba(0,0,0,${roomTrans})`;
  ctx.fillRect(0,0,W,H);
}

// === CHEST ANIMATION ===

function drawChest(x,y){
  ctx.save();ctx.translate(x,y);
  const w=30,h=24;
  // Chest base
  ctx.fillStyle='#8B4513';ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle='#a0522d';ctx.fillRect(-w/2,-h/2,w,4);
  // Gold trim
  ctx.fillStyle='#ffd700';ctx.fillRect(-w/2,-h/2,w,2);ctx.fillRect(-w/2,h/2-2,w,2);
  ctx.fillRect(-1,-h/2,2,h); // vertical trim
  // Lock
  ctx.fillStyle='#ffd700';ctx.fillRect(-3,-2,6,6);
  ctx.fillStyle='#000';ctx.fillRect(-1,0,2,3);
  // Lid opening
  if(chestOpen){
    const lidAng=chestAnim*Math.PI/3;
    ctx.save();ctx.translate(0,-h/2);ctx.rotate(-lidAng);
    ctx.fillStyle='#8B4513';ctx.fillRect(-w/2,-8,w,8);
    ctx.fillStyle='#ffd700';ctx.fillRect(-w/2,-8,w,2);
    // Light rays
    ctx.globalAlpha=0.3+Math.sin(animTime*5)*0.1;
    ctx.fillStyle='#ffd700';
    for(let a=-2;a<=2;a++){ctx.save();ctx.rotate(a*0.3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-20,-40);ctx.lineTo(20,-40);ctx.fill();ctx.restore()}
    ctx.globalAlpha=1;
    ctx.restore();
    // Gold coins flying out
    if(chestAnim<1){
      for(let i=0;i<10;i++){
        const cy=-h/2-chestAnim*40-i*5;
        const cx=Math.sin(animTime*3+i)*15;
        ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}

// === EXPLORABLE ROOM MAP ===
let showMap=false;
function mapNodes(){
  const zones=[
    {name:'Entrance',c:'#8d6e63',y:0.78},
    {name:'Blue Caverns',c:'#4dd0e1',y:0.66},
    {name:'Green Tunnels',c:'#66bb6a',y:0.54},

    {name:'Amethyst Halls',c:'#ce93d8',y:0.30},
    {name:'Titan Gate',c:'#ff7043',y:0.18},
  ];
  const N=18; const nodes=[];
  for(let i=0;i<N;i++){
    const z=Math.min(5,Math.floor(i/3));
    const col=(i%3)-1;
    nodes.push({i,x:0.5+col*0.26+(Math.sin(i*1.7)*0.04),y:zones[z].y+(i%3-1)*0.03,zone:z,zoneName:zones[z].name,c:zones[z].c,landmark:(i===5?'shop':i===9?'shrine':i===14?'boss':(i===0?'start':''))});
  }
  const edges=[];
  for(let i=0;i<N-1;i++){edges.push([i,i+1]); if(i%3===0&&i+2<N)edges.push([i,i+2]);}
  return {nodes,edges,zones};
}
function drawMap(){
  ctx.fillStyle='rgba(5,5,15,0.82)';ctx.fillRect(0,0,W,H);
  const M=mapNodes();
  const px=(nx)=>nx*W, py=(ny)=>ny*H;

  for(const[a,b]of M.edges){const A=M.nodes[a],B=M.nodes[b];ctx.beginPath();ctx.moveTo(px(A.x),py(A.y));ctx.lineTo(px(B.x),py(B.y));ctx.stroke();}
  const cur=state?Math.min(M.nodes.length-1,state.rooms_cleared):0;
  for(const n of M.nodes){
    const x=px(n.x),y=py(n.y);
    const reached=n.i<=cur, isCur=n.i===cur;
    ctx.globalAlpha=reached?1:0.35;
    if(n.landmark==='boss'){ctx.fillStyle='#ff5252';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('X',x,y+3);}

    else{ctx.fillStyle=n.c;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();}
    if(isCur){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('YOU',x,y-16);}
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px system-ui';ctx.textAlign='left';
  for(const z of M.zones){ctx.fillText(z.name,8,py(z.y)-2);}

// === MAIN GAME LOOP ===

function loop(){
  if(hitStop>0){hitStop--;requestAnimationFrame(loop);return;} // hit-stop freeze frame
  animTime+=0.016;
  let ox=0,oy=0;
  if(shakeTime>0){shakeTime--;ox=(Math.random()-0.5)*shakeMag;oy=(Math.random()-0.5)*shakeMag;shakeMag*=0.88}
  if(roomTrans>0){roomTrans-=0.04;if(roomTrans<0)roomTrans=0}
  if(chestAnim>0&&chestOpen){chestAnim=Math.min(1,chestAnim+0.03)}
  if(bossIntro>0){bossIntro-=0.008;if(bossIntro<0)bossIntro=0}
  if(attackAnim>0){attackAnim-=0.05;if(attackAnim<0)attackAnim=0}
  if(monsterEnter>0){monsterEnter-=0.04;if(monsterEnter<0)monsterEnter=0}
  // Dramatic camera: zoom/pan in when a monster appears or boss intro plays
  if(gameMode==='battle'||gameMode==='boss'){camTarget=1.12;camPanTarget=(gameMode==='boss'?0:W*0.06)}
  else {camTarget=1;camPanTarget=0}
  camZoom+=(camTarget-camZoom)*0.06;camPanX+=(camPanTarget-camPanX)*0.06;
  if(monsterDeath>0){monsterDeath-=0.02;if(monsterDeath<0)monsterDeath=0}
  if(levelUpTextLife>0){levelUpTextLife-=0.015;if(levelUpTextLife<0)levelUpTextLife=0}
  if(badgeMsgLife>0)badgeMsgLife-=0.012;
  if(victoryTime>0){victoryTime-=0.006;if(victoryTime<0)victoryTime=0}
  if(streakFire.length>0){streakFire=streakFire.filter(f=>f.life>0);streakFire.forEach(f=>{f.y-=1;f.life-=0.02;f.x+=Math.sin(animTime*10)*2})}
  if(goldRain.length>0){goldRain=goldRain.filter(g=>g.life>0);goldRain.forEach(g=>{g.y+=g.vy;g.vy+=0.2;g.life-=0.02})}
  if(attackTrail.length>0){attackTrail=attackTrail.filter(t=>t.life>0);attackTrail.forEach(t=>{t.life-=0.035})}
  if(spearTrails.length>0){spearTrails=spearTrails.filter(t=>t.life>0);spearTrails.forEach(t=>{t.life-=0.025})}
  bgOffset+=0.5;

  ctx.save();ctx.translate(ox,oy);
  drawCavernBg();

  if(showMap){drawMap();drawFlash();
  if(badgeMsgLife>0){ctx.save();ctx.globalAlpha=Math.min(1,badgeMsgLife*1.5);ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W*0.25,H*0.18,W*0.5,34);ctx.fillStyle='#ffd54f';ctx.fillText(badgeMsg,W*0.5,H*0.18+23);ctx.restore();}drawRoomTransition();drawVignette();ctx.restore();requestAnimationFrame(loop);return;}

  // Dramatic camera transform (applies to actors, not background/UI)
  ctx.save();
  ctx.translate(W/2+camPanX,H/2);
  ctx.scale(camZoom,camZoom);
  ctx.translate(-W/2,-H/2);

  const cy=H*0.45;
  if(gameMode==='battle'||gameMode==='boss'){
    drawBattleScene(cy);
  }else if(gameMode==='explore'||gameMode==='shop'||gameMode==='puzzle'||gameMode==='title'||gameMode==='treasure'||gameMode==='rest'){
    if(gameMode==='title'){
      // Animated title hero: idle bob + glow + drifting sparkles
      const bob=Math.sin(animTime*2)*4;
      ctx.save();
      ctx.shadowColor='#7c4dff';ctx.shadowBlur=20;
      drawPlayer(W*0.5,cy+bob,2.1,false,false,state?state.hero_class:null);
      ctx.restore();
      // drifting sparkles
      for(let i=0;i<10;i++){const sx=(0.2+i*0.06+Math.sin(animTime*0.5+i)*0.02)*W;const sy=(0.6+Math.sin(animTime*0.8+i*1.3)*0.12)*H;ctx.globalAlpha=0.4+0.4*Math.sin(animTime*2+i);ctx.fillStyle='#b388ff';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
    } else {
      // Player standing center
      drawPlayer(W*0.5,cy,2,false,false,state?state.hero_class:null);
    }
    // Treasure chest on treasure rooms
    if(gameMode==='treasure'||(state&&state.message_type==='treasure')){
      if(!chestOpen){chestOpen=true;chestAnim=0;sfxTreasure()}
      drawChest(W*0.5,cy-50);
    }
  }else if(gameMode==='gameover'){
    // Player lying down
    ctx.save();ctx.translate(W*0.5,cy);ctx.scale(2,2);ctx.rotate(Math.PI/2);
    ctx.globalAlpha=0.5;drawPlayer(0,0,1,false,false);ctx.globalAlpha=1;ctx.restore();
  }
  ctx.restore(); // end camera transform

  drawStreakFire();drawGoldRain();drawAttackTrail();drawSpears();drawLevelUpText();drawParticles();drawDmgNums();drawSpells();drawShockwaves();drawSwoosh();drawComboTexts();drawFlash();drawBossIntro();drawVictory();drawRoomTransition();drawVignette();
  if((gameMode==='explore'||gameMode==='rest'||gameMode==='treasure')&&storyScene>0){
    ctx.save();ctx.globalAlpha=0.55+0.45*Math.sin(animTime*2);
    const sc=ctx.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,110);sc.addColorStop(0,'rgba(155,89,182,0.55)');sc.addColorStop(1,'rgba(155,89,182,0)');
    ctx.fillStyle=sc;ctx.beginPath();ctx.arc(W/2,H*0.42,110,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  ctx.restore();
  if(storyScene>0){storyScene-=0.012;if(storyScene<=0)storyScene=0;}
  requestAnimationFrame(loop);
}

function drawBattleScene(cy){
  if(!state||!state.monster)return;
  // cinematic arena floor + vignette
  const gnd=ctx.createLinearGradient(0,cy+30,0,H);gnd.addColorStop(0,'rgba(40,20,60,0)');gnd.addColorStop(1,'rgba(20,10,35,0.85)');
  ctx.fillStyle=gnd;ctx.beginPath();ctx.ellipse(W/2,H-10,W*0.55,60,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(124,77,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W/2,H-10,W*0.5,52,0,0,Math.PI*2);ctx.stroke();
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const px=W*0.25,py=cy;
  const m=state.monster;const mx=W*0.72,my=cy;
  const pHit=lastState&&state.hp<lastState.hp;
  const mHit=lastState&&lastState.monster&&state.monster.hp<lastState.monster.hp;
  const pAttacking=attackAnim>0&&attackAnimWho==='player';
  const mAttacking=attackAnim>0&&attackAnimWho==='monster';
  // Player streak aura
  if(state&&state.streak>=2){const sa=Math.min(1,state.streak/8);ctx.save();ctx.globalAlpha=0.25+0.4*sa;const ag=ctx.createRadialGradient(px,py,8,px,py,46);ag.addColorStop(0,'rgba(255,80,120,0)');ag.addColorStop(1,'rgba(255,80,120,'+(0.5*sa)+')');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(px,py,46,0,Math.PI*2);ctx.fill();ctx.restore();}
  drawPlayer(px,py,1.8,pHit,pAttacking,state.hero_class);
  const mType=m.name.toLowerCase().split(' ')[0];
  const mEnterX=mx+monsterEnter*W*0.5;
  if(monsterDeath>0){ctx.globalAlpha=monsterDeath;ctx.translate(0,monsterDeath*20);drawMonster(mEnterX,my,1.8,mType,mHit,mAttacking,gameMode==='boss'?state.boss_phase:0);ctx.globalAlpha=1;}else{drawMonster(mEnterX,my,1.8,mType,mHit,mAttacking,gameMode==='boss'?state.boss_phase:0);}
  // Monster HP bar
  const mPct=Math.max(0,m.hp/m.max_hp);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W*0.5,cy-75,W*0.45,20);
  ctx.fillStyle=gameMode==='boss'?'#ff4444':'#ff8a80';ctx.font='bold 11px system-ui';ctx.textAlign='center';
  ctx.fillText(m.name+(gameMode==='boss'?' - BOSS':''),W*0.72,cy-63);
  ctx.fillStyle='#333';ctx.fillRect(W*0.52,cy-55,W*0.4,5);
  ctx.fillStyle=mPct>0.5?(gameMode==='boss'?'#e74c3c':'#e74c3c'):mPct>0.25?'#f39c12':'#c0392b';
  ctx.fillRect(W*0.52,cy-55,W*0.4*mPct,5);
  if(gameMode==='boss'&&state.boss_phase){
    const pc=state.boss_phase===1?'#b388ff':state.boss_phase===2?'#ff7043':'#ff1744';
    ctx.save();ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillStyle=pc;ctx.fillText('PHASE '+state.boss_phase+(state.boss_phase>1?' — ENRAGED!':''),W*0.72,cy-50);ctx.restore();
  }
  // Enemy attack telegraph
  if(mAttacking){ctx.save();ctx.globalAlpha=0.6+0.4*Math.sin(animTime*20);ctx.fillStyle='#ff1744';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('INCOMING',mx,my-70);ctx.restore();}
}

async function api(action,params={}){
  try{initAudio()}catch(e){}
  const body={action,sid:SID,...params};
  try{
    const res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if(data.sid){SID=data.sid;try{localStorage.setItem('cq_sid',SID);}catch(e){}}else if(action==='start'){try{localStorage.removeItem('cq_sid');localStorage.removeItem('cq_save');}catch(e){}savedSID=null;}
    if(data.state){onStateChange(state,data.state);state=data.state;if(state.rooms_cleared!=null)saveBest(state.rooms_cleared,state.level);try{localStorage.setItem('cq_save',JSON.stringify(state));}catch(e){}render()}
    else if(data.error){console.error('API error:',data.error)}
  }catch(e){console.error('API error:',e);if(ui)ui.innerHTML+='<div class="msg msg-miss">Connection error — is the server running?</div>'}
}

function onStateChange(prev,curr){
  if(!prev){gameMode=curr.mode||'explore';return}
  // Mode change = room transition
  if(curr.mode!==prev.mode){roomTrans=1}
  if(curr.story_stage>lastStoryStage && curr.story_stage<5){storyScene=1;}
  lastStoryStage=curr.story_stage||0;
  if((curr.mode==='battle'||curr.mode==='boss')&&prev.mode!=='battle'&&prev.mode!=='boss'){monsterEnter=1;attackAnim=0;attackAnimWho=null}
  // Player damage
  if(curr.hp<prev.hp){
    shakeTime=10;shakeMag=10;flashColor='#ff0000';flashAlpha=0.4;pHitFlash=1;
    spawnDmg(W*0.25,H*0.38,prev.hp-curr.hp,'player');
    spawnParticles(W*0.25,H*0.42,'#ff5252',25);sfxHurt();
    attackAnim=1;attackAnimWho='monster';
  }
  // Monster damage
  if(prev.monster&&curr.monster&&curr.monster.hp<prev.monster.hp){
    spawnDmg(W*0.72,H*0.38,prev.monster.hp-curr.monster.hp,'monster');
    spawnParticles(W*0.72,H*0.42,'#ffd54f',30);sfxHit();
    attackAnim=1;attackAnimWho='player';
    swoosh.push({x:W*0.5,y:H*0.45,life:1,color:curr.streak>=3?'#ff416c':'#4dd0e1'});
    castSpell(curr.streak>=3?'#ff416c':'#4dd0e1');
    if(curr.streak>=3){spawnShockwave(W*0.72,H*0.42,'#ff416c');shakeTime=14;shakeMag=10;spawnCombo('STREAK x'+curr.streak+'!',curr.streak>=5?'#ff416c':'#ff9800');}
    for(let i=0;i<8;i++)attackTrail.push({x:W*0.25+i*12,y:H*0.45,life:1,color:curr.streak>=3?'#ff416c':'#4dd0e1'});
    for(let i=0;i<12;i++)spearTrails.push({x:W*0.25+(i*18),y:H*0.42+Math.sin(i)*5,life:1,color:'#4dd0e1'});
  }
  if(prev.monster&&(!curr.monster||curr.mode!=='battle'&&curr.mode!=='boss')&&prev.mode==='battle'){
    monsterDeath=1;spawnParticles(W*0.72,H*0.42,'#ff5252',20);spawnParticles(W*0.72,H*0.42,'#ffd54f',15);
    for(let i=0;i<15;i++)goldRain.push({x:W*0.72+(Math.random()-0.5)*40,y:H*0.4,vy:-1-Math.random()*4,size:2+Math.random()*3,color:'#ffd700',life:1});
  }
  // Level up
  if(curr.level>(prev?.level||1)){
    levelUpText='LEVEL UP!';levelUpTextLife=1;
    flashColor='#9b59b6';flashAlpha=0.5;
    spawnParticles(W*0.5,H*0.5,'#ce93d8',40);spawnShockwave(W*0.5,H*0.5,'#ce93d8');
    hitStop=6;
    sfxLevelUp();
  }
  // Treasure
  if(curr.streak>=(prev?.streak||0)+1&&curr.streak>=3){
    for(let i=0;i<8;i++){streakFire.push({x:W*0.25+(Math.random()-0.5)*30,y:H*0.3+Math.random()*20,size:3+Math.random()*3,life:1,color:curr.streak>=5?'#ff416c':'#ff9800'})}
  }
  if(curr.message_type==='treasure'){flashColor='#ffd700';flashAlpha=0.3;spawnParticles(W*0.5,H*0.4,'#ffd54f',20);sfxTreasure();chestOpen=true;chestAnim=0;for(let i=0;i<25;i++){goldRain.push({x:W/2+(Math.random()-0.5)*80,y:H*0.35,vy:-1-Math.random()*5,size:2+Math.random()*4,color:'#ffd700',life:1})}}
  // Victory
  if(curr.message_type==='victory'&&curr.mode!=='boss'){flashColor='#ffd700';flashAlpha=0.3;sfxCorrect()}
  if(curr.story_stage>=5&&prev.story_stage<5){victoryTime=1;flashColor='#ffd700';flashAlpha=0.6;for(let i=0;i<40;i++)spawnParticles(W*0.5,H*0.45,'#ffd54f',40);sfxVictory();hitStop=8}
  // Correct answer
  if(prev.mode==='battle'&&curr.mode==='explore'&&curr.message_type==='victory'){sfxVictory()}
  // Wrong answer
  if(curr.message_type==='miss'&&prev.mode==='battle'){sfxWrong()}
  // Boss intro
  if(curr.mode==='boss'&&prev.mode!=='boss'){bossIntro=1;sfxBoss();shakeTime=24;shakeMag=12;spawnShockwave(W*0.5,H*0.45,'#9b59b6');for(let i=0;i<20;i++)spawnParticles(W*0.5,H*0.45,'#9b59b6',20)}
  // Death
  if(curr.mode==='gameover'){sfxDeath();shakeTime=20;shakeMag=15;flashColor='#ff0000';flashAlpha=0.6}
  // Shop enter
  if(curr.mode==='shop'&&prev.mode!=='shop'){sfxShop()}
  // Heal
  if(curr.hp>prev.hp&&curr.message_type==='heal'){spawnHeal(W*0.25,H*0.38,curr.hp-prev.hp);sfxCorrect()}
  if(curr.battles_won>0)earnBadge('firstblood','First Blood');
  if(curr.best_streak>=5)earnBadge('streak','Streak Master');
  if(curr.puzzles_solved>0)earnBadge('puzzle','Puzzle Solver');
  if(curr.rooms_cleared>=10)earnBadge('explorer','Deep Explorer');
  if(curr.story_stage>=5)earnBadge('champion','Champion');
  gameMode=curr.mode||'explore';
}

    const label={treasure:'💎 Treasure',battle:'⚔️ Battle',rest:'🌿 Rest',puzzle:'💻 Code Gate'};
    panel+=`<div style="text-align:center;font-size:0.8em;color:#ffd54f;margin:4px 0">The path splits! Which way?</div>`;
    panel+=`<div class="spell-row"><div class="spell-btn clickable" style="border-color:#4dd0e1" onclick="api('fork',{side:'left'})"><div style="font-weight:bold;color:#4dd0e1">⬅️ Left</div><div style="font-size:0.66em">${label[fl]||fl}</div></div><div class="spell-btn clickable" style="border-color:#ff8a80" onclick="api('fork',{side:'right'})"><div style="font-weight:bold;color:#ff8a80">Right ➡️</div><div style="font-size:0.66em">${label[fr]||fr}</div></div></div>`;
  }else if(state.mode==='battle'||state.mode==='boss'){
    const p=state.current_problem;
    if(state.choices){
      panel+=`<div style="font-size:0.7em;color:#bbb;margin:2px 0">Choose your spell:</div>`;
      panel+=`<div class="spell-row">`;
      state.choices.forEach((sp,i)=>{panel+=`<div class="spell-btn clickable ${selSpell===i?'sel':''}" style="border-color:${sp.color};${selSpell===i?'background:'+sp.color+'33':''}" onclick="selSpell=${i};render()"><div style="font-weight:bold;color:${sp.color}">${sp.name}</div><div style="font-size:0.62em;opacity:0.8">x${sp.mult} dmg</div><div style="font-size:0.58em;opacity:0.6">${sp.desc}</div></div>`;});
      panel+=`</div>`;
      if(state.special_ready){
        const SNAME={overload:"⚡ OVERLOAD",bulwark:"🛡 BULWARK",multishot:"🏿 MULTISHOT",great_heal:"🌡 GREAT HEAL"}[state.special]||"SPECIAL";
        panel+=`<button class="btn btn-special clickable" onclick="api('special')" style="margin:4px 0;width:100%;font-weight:bold;color:#ffd54f;border-color:#ffd54f">✦ ${SNAME} READY</button>`;
      }
    }
    panel+=`<div class="math-box"><div class="math-cat">${p.cat}</div><div class="math-q">${p.q}</div></div>`;
    panel+=`<input type="text" id="answer" placeholder="Your answer..." onkeypress="if(event.key==='Enter')doAnswer()">`;
    panel+=`<button class="btn btn-danger clickable" onclick="doAnswer()">${state.choices?state.choices[selSpell].name:'Attack!'}</button>`;
    if(state.last_spell)panel+=`<div style="font-size:0.62em;color:#ffd54f;text-align:center;margin-top:2px">Last: ${state.last_spell}</div>`;
  }else if(state.mode==='puzzle'){
    const p=state.current_puzzle;
    panel+=`<div style="font-size:0.85em;color:#80cbc4;font-weight:bold;text-align:center">Coding Puzzle (Level ${p.level})</div>`;
    panel+=`<p style="font-size:0.78em;text-align:center">${p.prompt}</p>`;
    panel+=`<div class="code-block">${p.code}</div>`;
    panel+=`<p style="font-size:0.68em;color:#666;text-align:center">Fill the blank (____)</p>`;
    panel+=`<input type="text" id="answer" placeholder="Fill the blank..." onkeypress="if(event.key==='Enter')doAnswer()">`;
    panel+=`<button class="btn btn-secondary clickable" style="font-size:0.8em" onclick="showHint=!showHint;render()">💡 Hint</button>`;
    if(showHint&&state.current_puzzle&&state.current_puzzle.hint)panel+=`<div style="font-size:0.72em;color:#ffd54f;background:rgba(255,213,79,0.1);padding:5px;border-radius:6px;margin:4px 0">💡 ${state.current_puzzle.hint}</div>`;
panel+=`<button class="btn btn-primary clickable" onclick="doAnswer()">Submit</button>`;
  }else if(state.mode==='shop'){
    panel+=`<div style="text-align:center;font-size:0.9em;color:#80cbc4;margin:3px">Shop</div>`;
    panel+=`<div class="shop-grid">`;
    panel+=`<div class="shop-item clickable" onclick="doShop('1')"><div class="nm">Potion</div><div class="pr">10 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('2')"><div class="nm">ATK +3</div><div class="pr">20 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('3')"><div class="nm">MaxHP +15</div><div class="pr">30 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('4')" style="background:rgba(80,80,80,0.2)"><div class="nm">Leave</div><div class="pr">free</div></div>`;
    panel+=`</div>`;
  }else if(state.mode==='gameover'){
    panel+=`<div style="text-align:center;padding:12px"><div style="font-size:1.3em;color:#ff5252;font-weight:bold">GAME OVER</div><p style="font-size:0.78em;color:#999;margin:3px">${state.name} fell in the Crystal Caverns...</p><p style="font-size:0.78em;color:#999">Level ${state.level} | Battles:${state.battles_won} | Puzzles:${state.puzzles_solved}</p><p style="font-size:0.78em;color:#999">Best Streak:${state.best_streak}</p><button class="btn btn-primary clickable" onclick="clearSave();SID=null;state=null;render()">Play Again</button></div>`;
  }
  if(showSettings){
    let sp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:8px">⚙️ Settings</div>`;
    sp+=`<div class="set-row"><span>🔊 Music</span><button class="btn ${settings.music?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('music')">${settings.music?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🔔 Sound FX</span><button class="btn ${settings.sfx?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('sfx')">${settings.sfx?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🌿 Reduced Motion</span><button class="btn ${settings.reducedMotion?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('reducedMotion')">${settings.reducedMotion?'On':'Off'}</button></div>`;
    sp+=`<p style="font-size:0.68em;color:#888;margin:6px 0">Reduced Motion turns off parallax, critters & weather for slower phones.</p>`;
    sp+=`<button class="btn btn-primary clickable" onclick="showSettings=false;render()">Done</button>`;
    ui.innerHTML=`<div class="panel clickable">${sp}</div>`;
    return;
  }
  if(showHelp){
    let hp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:6px">❓ How to Play</div>`;
    hp+=`<div style="font-size:0.74em;color:#ccc;line-height:1.5;text-align:left">
      <b>🎯 Goal:</b> Descend the Crystal Caverns, defeat the Crystal Titan, and grab the Knowledge Crystal.<br><br>
      <b>⚔️ Battles:</b> Solve the math problem, type your answer, then tap <b>Attack!</b> (or tap the screen). Correct hits damage the monster. 3+ in a row = STREAK bonus!<br><br>
      <b>💻 Puzzles:</b> Fill the blank in the code to open locks.<br><br>
      <b>🗺️ Explore:</b> Tap <b>Explore Next Room</b> to travel deeper. Use Potions to heal.<br><br>
      <b>🎵 Settings:</b> Toggle music, sound FX, and Reduced Motion for slower phones.<br><br>
      <b>📤 Win:</b> Beat the Titan to earn the Champion screen — share it with friends!</div>`;
    hp+=`<button class="btn btn-primary clickable" style="margin-top:8px" onclick="showHelp=false;render()">Got it!</button>`;
    ui.innerHTML=`<div class="panel clickable">${hp}</div>`;
    return;
  }
  ui.innerHTML=hud+`<div class="panel clickable">${panel}</div>`;
  const ans=document.getElementById('answer');
  if(ans)setTimeout(()=>ans.focus(),100);
}

function doAnswer(){const v=document.getElementById('answer').value;if(v)api('answer',{answer:v,choice:selSpell||0})}
function doShop(c){api('shop',{choice:c})}
function resumeGame(){if(!savedSID)return;SID=savedSID;api('resume').then(()=>{}).catch(()=>{});}
function hasLocalSave(){try{return !!localStorage.getItem('cq_save');}catch(e){return false;}}
function localSaveRoom(){try{return (JSON.parse(localStorage.getItem('cq_save')||'{}').rooms_cleared||0)+1;}catch(e){return 0;}}
function continueGame(){try{const st=JSON.parse(localStorage.getItem('cq_save'));if(!st)return;state=st;SID=null;savedSID=null;gameMode='play';if(st.mode==='title'||!st.mode){state.mode='explore';}render();api('restore',{state:st}).then(d=>{}).catch(()=>{});}catch(e){console.error(e);}}
function confirmNewGame(){
  const nm=(document.getElementById('name')&&document.getElementById('name').value)||'Hero';
  if(hasLocalSave()){
    const r=confirm('Start a NEW adventure? This erases your saved progress (Room '+localSaveRoom()+').');
    if(!r) return;
  }
  api('start',{name:nm,difficulty:selDiff,class:selClass});
}
function autoResumeIfSaved(){
  try{ if(hasLocalSave() && gameMode==='title'){ continueGame(); } }catch(e){console.error(e);}
}


function clearSave(){try{localStorage.removeItem('cq_sid');}catch(e){}savedSID=null;render();}
function badgeRow(){const m={firstblood:'🩸',streak:'🔥',puzzle:'💻',explorer:'🗺️',champion:'👑'};let s='';for(const k in m){if(badges[k])s+=m[k];}return s||'—';}
function shareVictory(){
  try{
    const cvs=document.getElementById('game').querySelector('canvas');
    const url=cvs.toDataURL('image/png');
    fetch(url).then(x=>x.blob()).then(blob=>{
      const f=new File([blob],'codequest-victory.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'CodeQuest Victory!',text:(state?state.name:'Hero')+' became Champion of the Crystal Caverns!'});
      }else{const a=document.createElement('a');a.href=url;a.download='codequest-victory.png';a.click();}
    });
  }catch(e){console.error('share failed',e);const a=document.createElement('a');a.href=document.getElementById('game').querySelector('canvas').toDataURL('image/png');a.download='codequest-victory.png';a.click();}
}
// === BEST RUN (localStorage) ===
function loadBest(){try{const b=localStorage.getItem('cq_best');if(b){const o=JSON.parse(b);if(o&&typeof o.rooms==='number')bestRun=o;}}catch(e){}}
function loadBadges(){try{const b=localStorage.getItem('cq_badges');if(b){const o=JSON.parse(b);if(o&&typeof o==='object')badges=o;}}catch(e){}}
function saveBadges(){try{localStorage.setItem('cq_badges',JSON.stringify(badges));}catch(e){}}
function earnBadge(id,name){if(badges[id])return;badges[id]=true;saveBadges();badgeMsg='🏅 '+name;badgeMsgLife=1;sfxCorrect();}
function saveBest(rooms,level){try{if(rooms>bestRun.rooms||(rooms===bestRun.rooms&&level>bestRun.level)){bestRun={rooms,level};localStorage.setItem('cq_best',JSON.stringify(bestRun));}}catch(e){}}
// Touch: tap the canvas during a fight to focus/submit answer (one-thumb play)
if(cv){cv.style.touchAction='manipulation';cv.addEventListener('pointerdown',()=>{
  if(gameMode==='battle'||gameMode==='boss'){const a=document.getElementById('answer');if(a){a.focus();if(a.value)doAnswer();}}
});}
loadBest();
loadBadges();
try{savedSID=localStorage.getItem('cq_sid');}catch(e){}
loadSettings();
render();
autoResumeIfSaved();
</script>
</body>
</html>
