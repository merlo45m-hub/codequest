<style>

@keyframes logopulse{0%,100%{filter:drop-shadow(0 0 6px rgba(124,77,255,0.5));transform:scale(1)}50%{filter:drop-shadow(0 0 18px rgba(124,77,255,0.9));transform:scale(1.03)}}

.panel input{font-size:1.15em;padding:14px;min-height:52px}
.math-q{font-size:1.6em;font-weight:bold;line-height:1.2}

.btn-primary{background:linear-gradient(135deg,#00f260,#0575E6);color:#fff}

.btn-secondary{background:rgba(255,255,255,0.1);color:#ccc}

.spell-btn{flex:1;border:2px solid #555;border-radius:10px;padding:5px 3px;background:rgba(255,255,255,0.05);text-align:center;cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s}

.math-box{text-align:center;margin:4px 0}

.code-block{background:rgba(0,0,0,0.5);border-radius:8px;padding:8px;margin:5px 0;font-family:monospace;font-size:0.9em;color:#80cbc4}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}

.story-t{font-size:0.82em;font-weight:bold;color:#b39ddb}
.story-x{font-size:0.7em;color:#9fa8da;font-style:italic;line-height:1.3}
/* ===== Combat refactor: enemy HUD, intent, mech, numpad, streak ===== */
.enemy-hud{margin:4px 0;}
.enemy-hud .ebarwrap{display:flex;align-items:center;gap:6px;}
.enemy-hud .ename{font-size:0.82em;font-weight:bold;color:#ff8a80;white-space:nowrap;}
.enemy-hud .ebar{flex:1;height:14px;background:rgba(0,0,0,0.6);border-radius:7px;overflow:hidden;border:1px solid rgba(255,138,128,0.4);}
.enemy-hud .ebarfill{height:100%;background:linear-gradient(90deg,#ff5252,#ff8a80);transition:width .25s;}
.enemy-hud .enum{font-size:0.72em;color:#ffcdd2;white-space:nowrap;}
.intent{margin:3px 0;padding:4px 8px;border-radius:8px;font-size:0.72em;text-align:center;}
.intent.warn{background:rgba(255,82,82,0.18);border:1px solid rgba(255,82,82,0.5);color:#ffcdd2;animation:pulseGlow 0.7s infinite;}
.intent.calm{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#bbb;}
.spell-mech{font-size:0.56em;opacity:0.85;color:#ffd54f;margin-top:2px;line-height:1.15;}
.spell-tier{font-size:0.54em;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;}
.tier-steady{color:#9be7ff;} .tier-big_hit{color:#ffd54f;} .tier-risky{color:#ff5252;}
.bulwark-note{margin:3px 0;font-size:0.66em;color:#9be7ff;text-align:center;background:rgba(77,208,225,0.1);border:1px solid rgba(77,208,225,0.35);border-radius:8px;padding:3px;}
.bulwark-active{background:rgba(77,208,225,0.28);border-color:#4dd0e1;color:#fff;font-weight:bold;}
.streak-badge{margin:3px 0;font-size:0.72em;font-weight:bold;color:#ff5252;text-align:center;background:rgba(255,65,108,0.16);border:1px solid rgba(255,65,108,0.45);border-radius:8px;padding:3px;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0;}
.numpad button{font-size:1.1em;font-weight:bold;padding:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;}
.numpad button:active{background:rgba(255,255,255,0.2);}
#loaderr{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#b71c1c;color:#fff;font-size:0.8em;padding:8px 10px;text-align:center;}
/* ===== HUD overflow fixes (prevent clipped XP/HP labels) ===== */
.hud{box-sizing:border-box;overflow:hidden;max-width:100vw;}
.hud .chip{flex-shrink:1;min-width:0;white-space:nowrap;}

.bar{box-sizing:border-box;}
</style>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

let W=480,H=800;

const CLIENT_CONFIG={max_particles:400,max_projectiles:64,max_shockwaves:24};

window.__loadError=function(msg){try{var d=document.getElementById('loaderr');if(d){d.style.display='block';d.textContent='⚠ Load error: '+msg;}}catch(e){}};
window.onerror=function(m,s,l,c,e){window.__loadError((m||'script error')+' @'+(l||'?'));return false;};

let settings={music:false,sfx:true,reducedMotion:false};
let showSettings=false;
let showMenu=false;
let showQuestLog=false;
let showHelp=false;
let showHint=false;
let roomTrans=0,roomTransDir=1;
let attackAnim=0,attackAnimWho=null;
let questionStart=0;  // RESPONSE COUNTDOWN: timestamp when current battle problem shown
let chestAnim=0,chestOpen=false;
let bossIntro=0;
let bgOffset=0;
let monsterDeath=0;
let pHurt=0, mHurt=0, pDeath=0, playerDead=false;  // hurt/death animation timers
let trauma=0;            // SHAKE: trauma accumulates 0..1, shake = trauma^2 (non-linear)
let shakeDirX=0,shakeDirY=0;  // directional bias
function addShake(mag,frames,dx,dy){shakeMag=Math.max(shakeMag,mag);shakeTime=Math.max(shakeTime,frames);trauma=Math.min(1,trauma+mag*0.05);if(dx||dy){const l=Math.hypot(dx,dy)||1;shakeDirX=dx/l;shakeDirY=dy/l;}}
let lowHpPulse=0;
let levelUpText="";

let streakFire=[];
let goldRain=[];

let spearTrails=[];

// === SOUND ENGINE (Web Audio API, no files needed) ===
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(freq,dur,type='square',vol=0.15){
  if(!audioCtx||!settings.sfx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
// === AMBIENT SOUNDTRACK (muted by default; toggle with 🔊) ===
let musicOn=false, musicNodes=null, currentMusicBiome='cavern';
function startMusic(biome){try{
  if(!audioCtx)return;
  if(musicNodes)stopMusic();
  const b=biome||currentMusicBiome||'cavern';
  const notes=b==='ruins'?[130.81,196.0]:[110.0,130.81]; // ruins: bright C major-ish; cavern: darker A minor-ish
  const pad=audioCtx.createGain();pad.gain.value=0.0;pad.connect(audioCtx.destination);
  const o1=audioCtx.createOscillator();o1.type='sine';o1.frequency.value=notes[0];
  const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=notes[1];
  const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.07;
  const lfoG=audioCtx.createGain();lfoG.gain.value=0.018;lfo.connect(lfoG);lfoG.connect(pad.gain);
  o1.connect(pad);o2.connect(pad);
  o1.start();o2.start();lfo.start();
  pad.gain.linearRampToValueAtTime(0.05,audioCtx.currentTime+2);
  musicNodes={pad,o1,o2,lfo};currentMusicBiome=b;
}catch(e){}}
function setMusicBiome(b){if(!b||b===currentMusicBiome)return;if(musicOn){startMusic(b);}else{currentMusicBiome=b;}}
function stopMusic(){if(musicNodes){try{musicNodes.pad.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);}catch(e){} musicNodes=null;}}
function toggleMusic(){settings.music=!settings.music;musicOn=settings.music;if(musicOn){initAudio();startMusic(curBiome);}else stopMusic();saveSettings();render();}
function saveSettings(){try{localStorage.setItem('cq_settings',JSON.stringify(settings));}catch(e){}}
function loadSettings(){try{const s=localStorage.getItem('cq_settings');if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){settings=Object.assign({music:false,sfx:true,reducedMotion:false},o);musicOn=settings.music;}}else{musicOn=settings.music;}}catch(e){}try{const m=localStorage.getItem('cq_mc');if(m==='1')multipleChoiceEnabled=true;}catch(e){}}
function saveMCE(){try{localStorage.setItem('cq_mc',multipleChoiceEnabled?'1':'0');}catch(e){}}
function toggleSetting(k){settings[k]=!settings[k];if(k==='music'){musicOn=settings.music;if(musicOn){initAudio();startMusic();}else stopMusic();}saveSettings();render();}
function sfxHit(){beep(800,0.08,'sawtooth',0.2);setTimeout(()=>beep(400,0.1,'sawtooth',0.15),60)}
function sfxHurt(){beep(200,0.15,'sawtooth',0.25);setTimeout(()=>beep(150,0.2,'sawtooth',0.2),80)}
function sfxCorrect(){beep(523,0.08,'sine',0.2);setTimeout(()=>beep(659,0.08,'sine',0.2),80);setTimeout(()=>beep(784,0.12,'sine',0.2),160)}
function sfxWrong(){beep(200,0.1,'square',0.15);setTimeout(()=>beep(150,0.15,'square',0.12),100)}
function sfxVictory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'sine',0.2),i*80))}

function vibe(p){try{if(navigator&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function sfxHit(){beep(800,0.08,'sawtooth',0.2);setTimeout(()=>beep(400,0.1,'sawtooth',0.15),60);vibe(25)}

function sfxWrong(){beep(200,0.1,'square',0.15);setTimeout(()=>beep(150,0.15,'square',0.12),100);vibe(60)}

function sfxTreasure(){[659,784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.08,'triangle',0.15),i*60));vibe(40)}

// AUDIO & JUICE: synthesized spell-cast + button-click SFX (Web Audio API)
function sfxCast(type){
  if(!audioCtx||!settings.sfx)return;

function drawBiomeSilhouette(depth){
  // Distinct landmark silhouette per biome, behind the parallax layers
  ctx.save();
  const off=(bgOffset*0.25)%W;
  if(depth<=1){
    // Blue Caverns: tall crystal spires
    ctx.fillStyle='rgba(90,140,220,0.30)';
    for(let i=-1;i<5;i++){const bx=i*W/3 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.lineTo(bx+W/8,H*0.10);ctx.lineTo(bx+W/4,H*0.5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(bx+W/12,H*0.5);ctx.lineTo(bx+W/8,H*0.22);ctx.lineTo(bx+W/5,H*0.5);ctx.closePath();ctx.fill();}
  }else if(depth<=3){
    // Green Tunnels: arching vines + mushroom caps
    ctx.strokeStyle='rgba(80,180,90,0.35)';ctx.lineWidth=3;
    for(let i=-1;i<6;i++){const bx=i*W/3.5 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.quadraticCurveTo(bx+W/8,H*0.15,bx+W/4,H*0.5);ctx.stroke();}
    ctx.fillStyle='rgba(120,220,120,0.30)';
    for(let i=0;i<5;i++){const bx=((i*W/4 - off)%(W+40));let x=bx;if(x<-20)x+=W+40;
      ctx.beginPath();ctx.ellipse(x,H*0.46,W/28,7,0,Math.PI,0);ctx.fill();}
  }else if(depth<=5){
    // Frozen Depths: jagged ice cliffs + drifting snow
    ctx.fillStyle='rgba(150,210,240,0.32)';
    for(let i=-1;i<6;i++){const bx=i*W/3 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.lineTo(bx+W/6,H*0.18);ctx.lineTo(bx+W/3,H*0.5);ctx.closePath();ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<24;i++){const sx=((i*53+animTime*8)%W);const sy=((i*91+animTime*20)%H);ctx.globalAlpha=0.4+Math.sin(animTime+i)*0.2;ctx.beginPath();ctx.arc(sx,sy,1.4,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }else{
    // Ruins: broken stone pillars + lair arch
    ctx.fillStyle='rgba(120,110,140,0.32)';
    for(let i=-1;i<6;i++){const bx=i*W/3 - off;const ph=20+Math.abs(Math.sin(i*2.1))*30;
      ctx.fillRect(bx,H*0.5-ph,W/22,ph);
      ctx.fillRect(bx+W/3-W/22,H*0.5-(ph*0.6),W/22,ph*0.6);}
    ctx.strokeStyle='rgba(155,89,182,0.28)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W/2,H*0.5,W*0.22,Math.PI,0);ctx.stroke();
  }
  ctx.restore();
}

    ctx.globalAlpha=glow*0.3;ctx.beginPath();ctx.arc(x,y-sz/2,sz*1.5,0,Math.PI*2);ctx.fill();
  }

  // LIVING WORLD: roaming critters behind actors

  drawDayNight();

function drawChest(x,y){
  ctx.save();ctx.translate(x,y);
  const w=30,h=24;
  // Chest base
  ctx.fillStyle='#8B4513';ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle='#a0522d';ctx.fillRect(-w/2,-h/2,w,4);
  // Gold trim
  ctx.fillStyle='#ffd700';ctx.fillRect(-w/2,-h/2,w,2);ctx.fillRect(-w/2,h/2-2,w,2);
  ctx.fillRect(-1,-h/2,2,h); // vertical trim
  // Lock
  ctx.fillStyle='#ffd700';ctx.fillRect(-3,-2,6,6);
  ctx.fillStyle='#000';ctx.fillRect(-1,0,2,3);
  // Lid opening
  if(chestOpen){
    const lidAng=chestAnim*Math.PI/3;
    ctx.save();ctx.translate(0,-h/2);ctx.rotate(-lidAng);
    ctx.fillStyle='#8B4513';ctx.fillRect(-w/2,-8,w,8);
    ctx.fillStyle='#ffd700';ctx.fillRect(-w/2,-8,w,2);
    // Light rays
    ctx.globalAlpha=0.3+Math.sin(animTime*5)*0.1;
    ctx.fillStyle='#ffd700';
    for(let a=-2;a<=2;a++){ctx.save();ctx.rotate(a*0.3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-20,-40);ctx.lineTo(20,-40);ctx.fill();ctx.restore()}
    ctx.globalAlpha=1;
    ctx.restore();
    // Gold coins flying out
    if(chestAnim<1){
      for(let i=0;i<10;i++){
        const cy=-h/2-chestAnim*40-i*5;
        const cx=Math.sin(animTime*3+i)*15;
        ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawVictory(){

  ctx.fillStyle=cg;ctx.shadowColor='#4dd0e1';ctx.shadowBlur=30*scale;

function spawnDmg(x,y,amount,who,heavy,crit){
  const big=amount>=20;const sz=(heavy||big||crit)?26+Math.min(amount,30):18+Math.min(amount,16);
  const drift=(Math.random()-0.5)*1.4;  // directional variance
  // COLOR CODING: yellow=crit, red=player damage, white=normal hit
  const col = crit ? '#ffeb3b' : (who==='player' ? (heavy?'#ff1744':'#ff5252') : '#ffffff');
  dmgNums.push({x:x+drift*6,y,vy:-2.4-drift*0.4,life:1,txt:'-'+(crit?'⚡':(heavy&&who==='player'?'⚠':''))+amount,color:col,size:sz,pop:1,crit:(crit||heavy||big)});
}
function spawnHeal(x,y,amount){
  dmgNums.push({x,y,vy:-2,life:1,txt:'+'+amount,color:'#2ecc71',size:16});
}

function drawStreakFire(){
  if(streakFire.length===0)return;
  for(const f of streakFire){
    ctx.globalAlpha=f.life*0.7;ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(f.x,f.y,f.size*(1+Math.sin(animTime*15)*0.3),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=f.life;ctx.fillStyle='rgba(255,200,0,'+f.life*0.3+')';
    ctx.beginPath();ctx.arc(f.x,f.y,f.size*2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawSpears(){
  if(spearTrails.length===0)return;
  for(const s of spearTrails){
    ctx.globalAlpha=s.life;ctx.fillStyle=s.color;
    ctx.fillRect(s.x-1,s.y-12,2,20);
  }
  ctx.globalAlpha=1;
}
function drawGoldRain(){
  for(const g of goldRain){
    ctx.globalAlpha=g.life;ctx.fillStyle=g.color;
    ctx.beginPath();ctx.arc(g.x,g.y,g.size,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=g.life*0.5;ctx.beginPath();ctx.arc(g.x,g.y,g.size*1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawAttackTrail(){
  for(const t of attackTrail){
    ctx.globalAlpha=t.life*0.4;ctx.fillStyle=t.color;
    ctx.fillRect(t.x-2,t.y-15,4,30);
  }
  ctx.globalAlpha=1;
}
function drawLevelUpText(){
  if(levelUpTextLife<=0)return;
  const lt=levelUpTextLife;
  ctx.globalAlpha=lt;
  ctx.font='bold 32px system-ui';ctx.textAlign='center';
  const scl=1+(1-lt)*0.5;
  ctx.save();ctx.translate(W*2, H*0.3);ctx.scale(scl,scl);
  ctx.strokeStyle='#000';ctx.lineWidth=5;
  ctx.strokeText(levelUpText,0,0);
  ctx.fillStyle='#ce93d8';ctx.fillText(levelUpText,0,0);
  ctx.restore();
  ctx.globalAlpha=1;
}
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}
function drawDmgNums(){
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i];d.y+=d.vy;d.vy*=0.97;d.life-=0.014;
    if(d.pop>0)d.pop-=0.09;
    if(d.life<=0){dmgNums.splice(i,1);continue}
    const t=Math.max(0,d.pop);
    const back=1+2.2*t*t*t - 1.2*t*t;
    const sc=0.6+0.4*Math.min(1,(1-d.life)+0.3)+ (t>0?0.5*back:0);
    ctx.save();ctx.translate(d.x,d.y);ctx.scale(sc,sc);
    ctx.globalAlpha=Math.min(1,d.life*1.6);ctx.textAlign='center';
    if(d.crit){ctx.shadowColor=d.color;ctx.shadowBlur=16;}
    ctx.font='bold '+(d.size*(d.crit?1.15:1))+'px system-ui';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,0.85)';
    ctx.strokeText(d.txt,0,0);ctx.fillStyle=d.color;ctx.fillText(d.txt,0,0);
    ctx.restore();
  }
}
function drawCountdownBar(){
  if(!(gameMode==='battle'||gameMode==='boss'))return;
  const elapsed=(performance.now()-questionStart)/1000;
  const frac=Math.max(0,1-Math.min(elapsed/10,1));
  const w=W*0.5, x=W*0.25, y=H*0.20, h=10;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(x-2,y-2,w+4,h+4);
  // crit zone (first 3s) gold, then red
  const inCrit=elapsed<3;
  const col=inCrit?'#ffd54f':(frac>0.3?'#ff8a65':'#ff1744');
  ctx.fillStyle=col;
  ctx.fillRect(x,y,w*frac,h);
  ctx.fillStyle=inCrit?'#fff':'#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';
  ctx.fillText(inCrit?('⚡ CRIT ZONE '+Math.max(0,(3-elapsed)).toFixed(1)+'s'):('⏱ '+Math.max(0,(10-elapsed)).toFixed(1)+'s'), x+w/2, y-6);
  ctx.restore();
}
function drawFlash(){
  if(pHitFlash>0){pHitFlash-=0.04;if(pHitFlash<0)pHitFlash=0;ctx.save();ctx.globalAlpha=pHitFlash*0.5;ctx.strokeStyle='#ff1744';ctx.lineWidth=18;ctx.strokeRect(9,9,W-18,H-18);ctx.restore();}
  if(flashAlpha>0){ctx.fillStyle=flashColor;ctx.globalAlpha=flashAlpha;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flashAlpha-=0.04}
}

function drawWeather(){

  ctx.save();

// === EXPLORABLE ROOM MAP ===
let showMap=false;
function mapNodes(){
  const zones=[
    {name:'Entrance',c:'#8d6e63',y:0.78},
    {name:'Blue Caverns',c:'#4dd0e1',y:0.66},
    {name:'Green Tunnels',c:'#66bb6a',y:0.54},
    {name:'Frozen Depths',c:'#90caf9',y:0.42},
    {name:'Amethyst Halls',c:'#ce93d8',y:0.30},
    {name:'Titan Gate',c:'#ff7043',y:0.18},
  ];
  const N=18; const nodes=[];
  for(let i=0;i<N;i++){
    const z=Math.min(5,Math.floor(i/3));
    const col=(i%3)-1;
    nodes.push({i,x:0.5+col*0.26+(Math.sin(i*1.7)*0.04),y:zones[z].y+(i%3-1)*0.03,zone:z,zoneName:zones[z].name,c:zones[z].c,landmark:(i===5?'shop':i===9?'shrine':i===14?'boss':(i===0?'start':''))});
  }
  const edges=[];
  for(let i=0;i<N-1;i++){edges.push([i,i+1]); if(i%3===0&&i+2<N)edges.push([i,i+2]);}
  return {nodes,edges,zones};
}
function drawMap(){
  ctx.fillStyle='rgba(5,5,15,0.82)';ctx.fillRect(0,0,W,H);
  const M=mapNodes();
  const px=(nx)=>nx*W, py=(ny)=>ny*H;
  ctx.strokeStyle='rgba(150,170,255,0.35)';ctx.lineWidth=3;
  for(const[a,b]of M.edges){const A=M.nodes[a],B=M.nodes[b];ctx.beginPath();ctx.moveTo(px(A.x),py(A.y));ctx.lineTo(px(B.x),py(B.y));ctx.stroke();}
  const cur=state?Math.min(M.nodes.length-1,state.rooms_cleared):0;
  for(const n of M.nodes){
    const x=px(n.x),y=py(n.y);
    const reached=n.i<=cur, isCur=n.i===cur;
    ctx.globalAlpha=reached?1:0.35;
    if(n.landmark==='boss'){ctx.fillStyle='#ff5252';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('X',x,y+3);}
    else if(n.landmark==='shop'){ctx.fillStyle='#ffd54f';ctx.fillRect(x-7,y-7,14,14);}
    else if(n.landmark==='shrine'){ctx.fillStyle='#80deea';ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+7,y+6);ctx.lineTo(x-7,y+6);ctx.closePath();ctx.fill();}
    else{ctx.fillStyle=n.c;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();}
    if(isCur){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('YOU',x,y-16);}
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px system-ui';ctx.textAlign='left';
  for(const z of M.zones){ctx.fillText(z.name,8,py(z.y)-2);}
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';
  ctx.fillText('Map: Crystal Caverns',W/2,28);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px system-ui';
  ctx.fillText('Press Explore to venture onward',W/2,H-24);
  ctx.textAlign='left';
}

let bloomCanvas=null,bloomScale=0.25,bloomFrame=0,bloomDisabled=false;
function drawBloom(){
  if(bloomDisabled)return;            // perf fallback: never let bloom freeze the game
  bloomFrame++;
  if(bloomFrame%2!==0)return;          // throttle: recompute every 2nd frame
  // POST-PROCESS BLOOM (cheap): bright-pass on a quarter-res buffer, then upscaled additive composite.
  // Full-res ctx.filter blur every frame was a mobile fps-killer -> downscale fixes it.
  try{
    if(!bloomCanvas){bloomCanvas=document.createElement('canvas');bloomCanvas.width=Math.max(1,Math.floor(W*bloomScale));bloomCanvas.height=Math.max(1,Math.floor(H*bloomScale));}
    const bw=bloomCanvas.width,bh=bloomCanvas.height;
    const b=bloomCanvas.getContext('2d');
    b.clearRect(0,0,bw,bh);
    b.drawImage(cvs,0,0,bw,bh);                 // downscale copy (cheap)
    b.globalCompositeOperation='multiply';
    b.fillStyle='rgba(70,70,90,1)';b.fillRect(0,0,bw,bh); // keep only bright pixels
    b.globalCompositeOperation='source-over';
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.55;
    if('filter' in ctx){ctx.filter='blur(3px)';}
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(bloomCanvas,0,0,W,H);          // upscale (GPU-assisted, cheap)
    ctx.filter='none';ctx.restore();
  }catch(e){bloomDisabled=true;}                 // if anything throws, disable rather than freeze
}
function drawComboTexts(){
  for(let i=comboTexts.length-1;i>=0;i--){const c=comboTexts[i];c.life-=0.012;c.y-=0.6;
    if(c.life<=0){comboTexts.splice(i,1);continue}
    ctx.globalAlpha=c.life;ctx.font='bold '+(20+c.life*14)+'px system-ui';ctx.textAlign='center';
    ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(c.txt,c.x,c.y);ctx.fillStyle=c.color;ctx.fillText(c.txt,c.x,c.y);ctx.globalAlpha=1;}
}
function drawSwoosh(){

// === COMBAT SPECTACLE: spell projectiles + shockwave finishers ===
let spells=[], shockwaves=[];
function spellBurst(x,y,color,type){
  if(type==='fire'){
    for(let i=0;i<22;i++){const a=-Math.PI/2+(Math.random()-0.5)*1.6;const sp=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,color:Math.random()<0.5?'#ff7043':'#ffd54f',size:2+Math.random()*4});}
    spawnShockwave(x,y,color);shockwaves.push({x,y,life:1,color:'#fff'});
  }else if(type==='ice'){
    for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2;const sp=3+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:'#aef',size:2+Math.random()*3});}
    spawnShockwave(x,y,color);shockwaves.push({x,y,life:1,color:'#81d4fa'});
  }else if(type==='lightning'){

function castSpell(color,type,mult){
  sfxCast(type);

  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;spawnParticles(W*0.25,H*0.45,bc,1);}

function spawnShockwave(x,y,color){if(shockwaves.length<CLIENT_CONFIG.max_shockwaves)shockwaves.push({x,y,life:1,color:color||'#ffd54f'})}
function drawSpells(){
  for(let i=spells.length-1;i>=0;i--){const s=spells[i];
    const dx=s.tx-s.x, dy=s.ty-s.y; const dist=Math.hypot(dx,dy);
    if(s.ay)s.vy+=s.ay;
    if(!s.trail)s.trail=[]; s.trail.push({x:s.x,y:s.y}); if(s.trail.length>6)s.trail.shift();
    s.x+=dx*0.25; s.y+=(dy*0.25)+(s.vy||0); s.life-=0.06;
    if(s.life<=0||dist<8){spells.splice(i,1); spellBurst(s.tx,s.ty,s.color,s.type); continue;}
    for(let t=0;t<s.trail.length;t++){const tp=s.trail[t];ctx.globalAlpha=0.12*(t/s.trail.length);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(tp.x,tp.y,s.size*0.7,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=0.9;ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=20;
    if(s.type==='lightning'){
      ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y);
      for(let k=0;k<3;k++)ctx.lineTo(s.x+(Math.random()-0.5)*10,s.y+(Math.random()-0.5)*10);ctx.stroke();
    }else if(s.type==='ice'){
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(animTime*8);ctx.beginPath();ctx.moveTo(0,-s.size);ctx.lineTo(s.size*0.5,s.size*0.4);ctx.lineTo(-s.size*0.5,s.size*0.4);ctx.closePath();ctx.fill();ctx.restore();
    }else if(s.type==='fire'){
      ctx.beginPath();ctx.arc(s.x,s.y,s.size*(0.8+Math.random()*0.4),0,Math.PI*2);ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.globalAlpha=0.3;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x-6,s.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
}
function drawShockwaves(){
  for(let i=shockwaves.length-1;i>=0;i--){const w=shockwaves[i];w.life-=0.04;
    if(w.life<=0){shockwaves.splice(i,1);continue}
    const r=(1-w.life)*60+6;
    ctx.globalAlpha=w.life*0.7;ctx.strokeStyle=w.color;ctx.lineWidth=3*w.life;

}

// === MAIN GAME LOOP ===

function loop(){
  if(W<2||H<2)resize();  // defensive: if canvas ended up 0-size (layout not ready), recover
  if(hitStop>0){hitStop--;requestAnimationFrame(loop);return;} // hit-stop freeze frame
  animTime+=0.016;
  let ox=0,oy=0;
  try{
  if(shakeTime>0){shakeTime--;const s=shakeMag*(trauma*trauma);ox=(Math.random()-0.5)*s+shakeDirX*s*0.5;oy=(Math.random()-0.5)*s+shakeDirY*s*0.5;shakeMag*=0.88;trauma*=0.9}
  if(roomTrans>0){roomTrans-=0.04;if(roomTrans<0)roomTrans=0}
  if(chestAnim>0&&chestOpen){chestAnim=Math.min(1,chestAnim+0.03)}
  if(bossIntro>0){bossIntro-=0.008;if(bossIntro<0)bossIntro=0}
  if(attackAnim>0){attackAnim-=0.05;if(attackAnim<0)attackAnim=0}
  if(monsterEnter>0){monsterEnter-=0.04;if(monsterEnter<0)monsterEnter=0}
  // Dramatic camera: zoom/pan in when a monster appears or boss intro plays
  if(gameMode==='battle'||gameMode==='boss'){camTarget=1.12;camPanTarget=(gameMode==='boss'?0:W*0.06)}
  else {camTarget=1;camPanTarget=0}
  // LOOK-AHEAD: bias the camera toward the active actor for fluid tracking (deadzone feel)
  if(attackAnimWho==='player')camPanTarget+=W*0.05;
  else if(attackAnimWho==='monster')camPanTarget-=W*0.05;
  camZoom+=(camTarget-camZoom)*0.06;camPanX+=(camPanTarget-camPanX)*0.06;
  if(monsterDeath>0){monsterDeath-=0.02;if(monsterDeath<0)monsterDeath=0}
  if(pHurt>0){pHurt-=0.06;if(pHurt<0)pHurt=0}
  if(mHurt>0){mHurt-=0.06;if(mHurt<0)mHurt=0}
  if(playerDead){pDeath+=0.012;if(pDeath>1)pDeath=1}
  if(levelUpTextLife>0){levelUpTextLife-=0.015;if(levelUpTextLife<0)levelUpTextLife=0}
  if(badgeMsgLife>0)badgeMsgLife-=0.012;
  if(victoryTime>0){victoryTime-=0.006;if(victoryTime<0)victoryTime=0}
  if(streakFire.length>0){streakFire=streakFire.filter(f=>f.life>0);streakFire.forEach(f=>{f.y-=1;f.life-=0.02;f.x+=Math.sin(animTime*10)*2})}

  if(attackTrail.length>0){attackTrail=attackTrail.filter(t=>t.life>0);attackTrail.forEach(t=>{t.life-=0.035})}
  if(spearTrails.length>0){spearTrails=spearTrails.filter(t=>t.life>0);spearTrails.forEach(t=>{t.life-=0.025})}
  bgOffset+=0.5;

  ctx.save();ctx.translate(ox,oy);
  drawCavernBg();

  if(showMap){drawMap();drawFlash();
  if(badgeMsgLife>0){ctx.save();ctx.globalAlpha=Math.min(1,badgeMsgLife*1.5);ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W*0.25,H*0.18,W*0.5,34);ctx.fillStyle='#ffd54f';ctx.fillText(badgeMsg,W*0.5,H*0.18+23);ctx.restore();}drawRoomTransition();drawVignette();ctx.restore();requestAnimationFrame(loop);return;}

  // Dramatic camera transform (applies to actors, not background/UI)
  ctx.save();
  ctx.translate(W/2+camPanX,H/2);
  ctx.scale(camZoom,camZoom);
  ctx.translate(-W/2,-H/2);

  const cy=H*0.45;
  if(gameMode==='battle'||gameMode==='boss'){
    drawBattleScene(cy);
  }else if(gameMode==='explore'||gameMode==='shop'||gameMode==='puzzle'||gameMode==='title'||gameMode==='treasure'||gameMode==='rest'){
    if(gameMode==='title'){
      // Animated title hero: idle bob + glow + drifting sparkles
      const bob=Math.sin(animTime*2)*4;
      ctx.save();
      ctx.shadowColor='#7c4dff';ctx.shadowBlur=20;
      drawPlayer(W*0.5,cy+bob,2.1,false,false,state?state.hero_class:null);

      // drifting sparkles
      for(let i=0;i<10;i++){const sx=(0.2+i*0.06+Math.sin(animTime*0.5+i)*0.02)*W;const sy=(0.6+Math.sin(animTime*0.8+i*1.3)*0.12)*H;ctx.globalAlpha=0.4+0.4*Math.sin(animTime*2+i);ctx.fillStyle='#b388ff';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}

      drawChest(W*0.5,cy-50);
    }
  }else if(gameMode==='gameover'){
    // Player lying down
    ctx.save();ctx.translate(W*0.5,cy);ctx.scale(2,2);ctx.rotate(Math.PI/2);
    ctx.globalAlpha=0.5;drawPlayer(0,0,1,false,false);ctx.globalAlpha=1;ctx.restore();
  }
  ctx.restore(); // end camera transform

  drawStreakFire();drawGoldRain();drawAttackTrail();drawSpears();drawLevelUpText();drawParticles();drawDmgNums();drawSpells();drawShockwaves();drawSwoosh();drawComboTexts();drawFlash();drawBossIntro();drawVictory();drawRoomTransition();drawVignette();drawBloom();drawCountdownBar();
  if((gameMode==='explore'||gameMode==='rest'||gameMode==='treasure')&&storyScene>0){
    ctx.save();ctx.globalAlpha=0.55+0.45*Math.sin(animTime*2);
    const sc=ctx.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,110);sc.addColorStop(0,'rgba(155,89,182,0.55)');sc.addColorStop(1,'rgba(155,89,182,0)');
    ctx.fillStyle=sc;ctx.beginPath();ctx.arc(W/2,H*0.42,110,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  ctx.restore();
  if(storyScene>0){storyScene-=0.012;if(storyScene<=0)storyScene=0;}
  }catch(e){drawFrameError(e);}
  requestAnimationFrame(loop);
}

// === STATE MANAGEMENT ===

async function api(action,params={}){
  try{initAudio()}catch(e){}
  const body={action,sid:SID,...params};
  try{
    const res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if(data.sid){SID=data.sid;try{localStorage.setItem('cq_sid',SID);}catch(e){}}else if(action==='start'){try{localStorage.removeItem('cq_sid');localStorage.removeItem('cq_save');}catch(e){}savedSID=null;}
    if(data.state){onStateChange(state,data.state);state=data.state;if(state&&state.max_hp!=null){const _ch=state.hp;state.hp=Math.min(Math.max(0,_ch),state.max_hp);}if(state.rooms_cleared!=null)saveBest(state.rooms_cleared,state.level);try{localStorage.setItem('cq_save',JSON.stringify(state));}catch(e){}render()}
    else if(data.error){console.error('API error:',data.error)}
  }catch(e){console.error('API error:',e);if(ui)ui.innerHTML+='<div class="msg msg-miss">Connection error — is the server running?</div>'}
}

function onStateChange(prev,curr){
  if(!prev){gameMode=curr.mode||'explore';return}
  // Mode change = room transition
  if(curr.mode!==prev.mode){roomTrans=1}
  if(curr.story_stage>lastStoryStage){storyScene=1;recordClue(curr.story_stage);}
  lastStoryStage=curr.story_stage||0;
  if((curr.mode==='battle'||curr.mode==='boss')&&prev.mode!=='battle'&&prev.mode!=='boss'){monsterEnter=1;attackAnim=0;attackAnimWho=null;monsterHpDisp=1}
  // Player damage
  if(curr.hp<prev.hp){
    const dmg=prev.hp-curr.hp;const heavy=dmg>=18;
    addShake(heavy?14:7, heavy?14:7);flashColor='#ff0000';flashAlpha=heavy?0.5:0.3;pHitFlash=1;pHurt=1;if(heavy)hitStop=Math.min(5,2+Math.floor(dmg/16));
    spawnDmg(W*0.25,H*0.38,dmg,'player',heavy);
    spawnParticles(W*0.25,H*0.42,'#ff5252',25);sfxHurt();
    attackAnim=1;attackAnimWho='monster';
  }
  // Monster damage

      // CHARGED passive buff
      if((state.charges||0)>=(state.combo_threshold||3)){
        panel+=`<div style="text-align:center;font-size:0.66em;font-weight:bold;color:#ffd54f;background:rgba(255,213,79,0.14);border:1px solid rgba(255,213,79,0.4);border-radius:8px;padding:3px;margin:3px 0">⚡ CHARGED BUFF — next cast ×1.6 (HOLDING)</div>`;
      }
    }
    // STREAK BADGE (explicit combo bonus)
    if(state.streak>=2){
      const bonus=state.streak*2;
      panel+=`<div class="streak-badge">🔥 ${state.streak}x Combo: +${bonus}% damage bonus</div>`;
    }
    panel+=`<div class="math-box"><div class="math-cat">${p.cat}</div><div class="math-q">${p.q}</div></div>`;
    // ANSWER INPUT: exactly one method by state
    const useMc = !!(multipleChoiceEnabled && p && p.mc && p.mc.length);
    panel+=`<div class="thumb-cluster">`;
    if(useMc){
      panel+=`<div class="mc-grid">`;
      p.mc.forEach((opt,i)=>{panel+=`<button class="mc-btn clickable" style="border-color:#4dd0e1" onclick="mcAnswer(${i})">${opt}</button>`;});
      panel+=`</div>`;
      panel+=`<div style="text-align:center;font-size:0.66em;color:#9be7ff;margin:2px 0">Tap an option above to answer</div>`;
    }else{
      panel+=`<input type="text" id="answer" inputmode="numeric" pattern="[0-9]*" placeholder="Your answer..." onkeypress="if(event.key==='Enter')bufferedDoAnswer()" onclick="this.select()">`;
      panel+=`<div class="numpad">`+['1','2','3','4','5','6','7','8','9','⌫','0','C'].map(k=>{
        if(k==='⌫')return `<button type="button" onclick="cqNum('-1')">${k}</button>`;
        if(k==='C')return `<button type="button" onclick="cqNum('C')">${k}</button>`;
        return `<button type="button" onclick="cqNum('${k}')">${k}</button>`;
      }).join('')+`</div>`;
      panel+=`<button class="btn btn-danger clickable" onclick="bufferedAttack()">Cast Selected</button>`;
    }
    panel+=`</div>`;
    if(state.last_spell)panel+=`<div style="font-size:0.62em;color:#ffd54f;text-align:center;margin-top:2px">Last: ${state.last_spell}</div>`;
  }else if(state.mode==='puzzle'){
    const p=state.current_puzzle;
    panel+=`<div style="font-size:0.85em;color:#80cbc4;font-weight:bold;text-align:center">Coding Puzzle (Level ${p.level})</div>`;
    panel+=`<p style="font-size:0.78em;text-align:center">${p.prompt}</p>`;
    panel+=`<div class="code-block">${p.code}</div>`;
    panel+=`<p style="font-size:0.68em;color:#666;text-align:center">Fill the blank (____)</p>`;
    panel+=`<input type="text" id="answer" placeholder="Fill the blank..." onkeypress="if(event.key==='Enter')bufferedDoAnswer()">`;
    panel+=`<button class="btn btn-secondary clickable" style="font-size:0.8em" onclick="showHint=!showHint;render()">💡 Hint</button>`;
    if(showHint&&state.current_puzzle&&state.current_puzzle.hint)panel+=`<div style="font-size:0.72em;color:#ffd54f;background:rgba(255,213,79,0.1);padding:5px;border-radius:6px;margin:4px 0">💡 ${state.current_puzzle.hint}</div>`;
panel+=`<button class="btn btn-primary clickable" onclick="doAnswer()">Submit</button>`;
  }else if(state.mode==='shop'){
    panel+=`<div style="text-align:center;font-size:0.9em;color:#80cbc4;margin:3px">Shop</div>`;
    panel+=`<div class="shop-grid">`;
    panel+=`<div class="shop-item clickable" onclick="doShop('1')"><div class="nm">Potion</div><div class="pr">10 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('2')"><div class="nm">ATK +3</div><div class="pr">20 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('3')"><div class="nm">MaxHP +15</div><div class="pr">30 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('4')" style="background:rgba(80,80,80,0.2)"><div class="nm">Leave</div><div class="pr">free</div></div>`;
    panel+=`</div>`;
  }else if(state.mode==='gameover'){
    panel+=`<div style="text-align:center;padding:12px"><div style="font-size:1.3em;color:#ff5252;font-weight:bold">GAME OVER</div><p style="font-size:0.78em;color:#999;margin:3px">${state.name} fell in the Crystal Caverns...</p><p style="font-size:0.78em;color:#999">Level ${state.level} | Battles:${state.battles_won} | Puzzles:${state.puzzles_solved}</p><p style="font-size:0.78em;color:#999">Best Streak:${state.best_streak}</p><button class="btn btn-primary clickable" onclick="clearSave();SID=null;state=null;render()">Play Again</button></div>`;
  }
  if(showSettings){
    let sp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:8px">⚙️ Settings</div>`;
    sp+=`<div class="set-row"><span>🔊 Music</span><button class="btn ${settings.music?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('music')">${settings.music?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🔔 Sound FX</span><button class="btn ${settings.sfx?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('sfx')">${settings.sfx?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🌿 Reduced Motion</span><button class="btn ${settings.reducedMotion?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('reducedMotion')">${settings.reducedMotion?'On':'Off'}</button></div>`;
    sp+=`<p style="font-size:0.68em;color:#888;margin:6px 0">Reduced Motion turns off parallax, critters & weather for slower phones.</p>`;
    sp+=`<button class="btn btn-primary clickable" onclick="showSettings=false;render()">Done</button>`;
    ui.innerHTML=`<div class="panel clickable">${sp}</div>`;
    return;
  }
  if(showHelp){
    let hp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:6px">❓ How to Play</div>`;
    hp+=`<div style="font-size:0.74em;color:#ccc;line-height:1.5;text-align:left">
      <b>🎯 Goal:</b> Descend the Crystal Caverns, defeat the Crystal Titan, and grab the Knowledge Crystal.<br><br>
      <b>⚔️ Battles:</b> Solve the math problem, type your answer, then tap <b>Attack!</b> (or tap the screen). Correct hits damage the monster. 3+ in a row = STREAK bonus!<br><br>
      <b>💻 Puzzles:</b> Fill the blank in the code to open locks.<br><br>
      <b>🗺️ Explore:</b> Tap <b>Explore Next Room</b> to travel deeper. Use Potions to heal.<br><br>
      <b>🎵 Settings:</b> Toggle music, sound FX, and Reduced Motion for slower phones.<br><br>
      <b>📤 Win:</b> Beat the Titan to earn the Champion screen — share it with friends!</div>`;
    hp+=`<button class="btn btn-primary clickable" style="margin-top:8px" onclick="showHelp=false;render()">Got it!</button>`;
    ui.innerHTML=`<div class="panel clickable">${hp}</div>`;
    return;
  }
  if(showMenu){
    let mp=`<div style="text-align:center;font-size:1.05em;font-weight:bold;color:#4dd0e1;margin-bottom:8px">☰ Menu</div>`;
    mp+=`<button class="btn btn-primary clickable" style="width:100%;margin:4px 0" onclick="showMenu=false;render()">▶️ Resume</button>`;
    mp+=`<button class="btn btn-warning clickable" style="width:100%;margin:4px 0" onclick="confirmRestart()">🔄 Restart</button>`;
    mp+=`<button class="btn btn-info clickable" style="width:100%;margin:4px 0" onclick="showMenu=false;showSettings=true;render()">⚙️ Settings</button>`;
    mp+=`<button class="btn btn-info clickable" style="width:100%;margin:4px 0" onclick="showMenu=false;showHelp=true;render()">❓ How to Play</button>`;
    mp+=`<button class="btn btn-secondary clickable" style="width:100%;margin:4px 0" onclick="mainMenu()">🏠 Main Menu</button>`;
    mp+=`<button class="btn btn-info clickable" style="width:100%;margin:4px 0" onclick="showMenu=false;showQuestLog=true;render()">📖 Quest Log</button>`;
    ui.innerHTML=`<div class="panel clickable">${mp}</div>`;
    return;
  }
  if(showQuestLog){
    const stg=(state&&state.story_stage)||0;
    const OBJECTIVES={0:"Find Master Ordella. Recover the Knowledge Crystal. Bring lost knowledge home.",1:"Opening Quest — survive the Blue Caverns and reach the Green Tunnels.",2:"Crack the locked code-door. Push into the Frozen Depths.",3:"Endure the ice. Reach the Titan’s chamber.",4:"Defeat the Crystal Titan. Claim the Knowledge Crystal.",5:"You are Champion — return with Ordella and the Crystal."};
    const UNLOCKS={2:"🔓 Code-Smith — read the locked doors’ runes (coding puzzles reveal a hint).",3:"🔓 Frost Ward — spell power grows in the depths.",4:"⚡ Climax: win, and the great forgetting ends.",5:"🔓 Resolution: the Knowledge Crystal restored. Ordella freed."};
    const stories=[{stage:0,title:"🏔️ The Crystal Caverns",text:"Beneath the realm lies the Crystal Caverns — a living labyrinth of math-forged crystal. The old mages sealed the world’s knowledge in the Knowledge Crystal. Its feral equation-guardians claimed the depths."},{stage:1,title:"🔵 The Blue Caverns — First Trial",text:"The opening trial: prove your mind against the feral equations. A clue to Ordella’s fate waits here."},{stage:2,title:"🟢 The Green Tunnels — The Locked Door",text:"A locked door of living code blocks the path. Ordella’s riddle is carved on its frame."},{stage:3,title:"❄️ The Frozen Depths — The Long Dark",text:"The light fails; the Titan’s presence weighs on you. The long middle of the quest."},{stage:4,title:"💎 THE CRYSTAL TITAN — Climax",text:"The Titan tests your mind. Win, and the great forgetting ends."},{stage:5,title:"👑 VICTORY — Resolution",text:"The Crystal restored, Ordella freed, lost knowledge returns to the surface."}];
    let ql=`<div style="text-align:center;font-size:1.05em;font-weight:bold;color:#ffd54f;margin-bottom:6px">📖 Quest Log</div>`;
    // Acts overview
    ql+=`<div class="story-box"><div class="story-t">🎯 Current Objective</div><div class="story-x">${OBJECTIVES[stg]||OBJECTIVES[0]}</div></div>`;
    if(UNLOCKS[stg])ql+=`<div class="story-box" style="border-left-color:#4dd0e1;background:rgba(77,208,225,0.08)"><div class="story-t" style="color:#4dd0e1">Progression</div><div class="story-x">${UNLOCKS[stg]}</div></div>`;
    // Story so far (beats reached)
    ql+=`<div style="font-size:0.8em;font-weight:bold;color:#b39ddb;margin:8px 0 3px">📜 Story So Far</div>`;
    stories.forEach(s=>{ if(s.stage<=stg) ql+=`<div class="story-box"><div class="story-t">${s.title}</div><div class="story-x">${s.text}</div></div>`; });
    // Ordella clue trail
    ql+=`<div style="font-size:0.8em;font-weight:bold;color:#ff8a80;margin:8px 0 3px">🔎 Ordella’s Trail</div>`;
    if(discoveredClues.length){ discoveredClues.forEach(c=>{ ql+=`<div class="story-box" style="border-left-color:#ff8a80;background:rgba(255,138,128,0.08)"><div class="story-x">${c}</div></div>`; }); }
    else ql+=`<div class="story-x" style="color:#888">No clues found yet — descend deeper.</div>`;
    ql+=`<button class="btn btn-primary clickable" style="width:100%;margin-top:8px" onclick="showQuestLog=false;render()">◀️ Back</button>`;
    ui.innerHTML=`<div class="panel clickable" style="max-height:78vh;overflow:auto">${ql}</div>`;
    return;
  }
  ui.innerHTML=hud+`<div class="panel clickable">${panel}</div>`;
  const ans=document.getElementById('answer');
  if(ans)setTimeout(()=>ans.focus(),100);
}

// QUEST LOG: discovered Ordella clues (persisted) + clue map
let discoveredClues=[];
try{const _c=localStorage.getItem('cq_clues');if(_c)discoveredClues=JSON.parse(_c);}catch(e){}
function saveClues(){try{localStorage.setItem('cq_clues',JSON.stringify(discoveredClues));}catch(e){}}
const CLUES={1:"A clue to Ordella\u2019s fate waits in the blue halls.",2:"Ordella\u2019s hand is carved on the locked door \u2014 a riddle she left for whoever followed.",3:"Deeper still, the Titan\u2019s shadow falls across Ordella\u2019s last known path."};
function recordClue(stage){if(stage&&CLUES[stage]&&!discoveredClues.includes(CLUES[stage])){discoveredClues.push(CLUES[stage]);saveClues();}}
// Spell mechanic/risk descriptions (mirror server tiers; server also sends sp.tier/sp.risk)
window.SPELL_MECH={
  "Spark Bolt":{tier:"steady",mech:"Reliable. No drawback."},
  "Flame Burst":{tier:"big_hit",mech:"Heavy hit."},
  "Frost Lance":{tier:"big_hit",mech:"Strong hit."},
  "Stone Smash":{tier:"big_hit",mech:"Standard / Heavy. No drawback."},
  "Venom Spray":{tier:"big_hit",mech:"+ Poison: 10 dmg/turn for 3 turns."},
  "Shadow Strike":{tier:"risky",mech:"Risky: 15% miss (0 dmg)."}
};
function cqNum(k){const el=document.getElementById('answer');if(!el)return;if(k==='C'){el.value='';}else if(k==='-1'){el.value=el.value.slice(0,-1);}else{el.value=(el.value+k).replace(/[^0-9-]/g,'');}el.focus();}
function doAnswer(){const v=document.getElementById('answer').value;if(v){const rt=(performance.now()-questionStart)/1000;api('answer',{answer:v,choice:selSpell||0,response_time:Math.max(0,Math.min(rt,10))})}}
function mcAnswer(i){try{const p=state&&state.current_problem;if(!p||!p.mc||p.mc[i]===undefined)return;const rt=(performance.now()-questionStart)/1000;api('answer',{answer:String(p.mc[i]),choice:selSpell||0,mc_index:i,response_time:Math.max(0,Math.min(rt,10))});}catch(e){console.error('mcAnswer',e);}}
// INPUT BUFFER (120ms): forgiving input so a tap fired slightly before the problem is ready still lands
let bufferedAction=null,bufferedAt=0;
const INPUT_BUFFER_MS=120;
function queueAction(fn){const now=performance.now();if(now-bufferedAt<INPUT_BUFFER_MS&&bufferedAction)bufferedAction();bufferedAction=fn;bufferedAt=now;if(!window.__bufTick){window.__bufTick=true;setTimeout(()=>{window.__bufTick=false;if(bufferedAction){const a=bufferedAction;bufferedAction=null;a();}},INPUT_BUFFER_MS);}}
function bufferedDoAnswer(){queueAction(doAnswer);}
function bufferedAttack(){queueAction(()=>doAnswer());}
function doShop(c){api('shop',{choice:c})}
function resumeGame(){if(!savedSID)return;SID=savedSID;api('resume').then(()=>{}).catch(()=>{});}
function hasLocalSave(){try{return !!localStorage.getItem('cq_save');}catch(e){return false;}}
function localSaveRoom(){try{return (JSON.parse(localStorage.getItem('cq_save')||'{}').rooms_cleared||0)+1;}catch(e){return 0;}}
function sanitizeState(s){try{if(!s||typeof s!=='object')return null;if(typeof s.max_hp!=='number'||s.max_hp<80||typeof s.hp!=='number')return null;if(s.hp>s.max_hp)s.hp=s.max_hp;if(s.hp<0)s.hp=0;return s;}catch(e){return null;}}
function continueGame(){try{const raw=localStorage.getItem('cq_save');if(!raw)return;const st=sanitizeState(JSON.parse(raw));if(!st){try{localStorage.removeItem('cq_save');}catch(e){}return;}state=st;SID=null;savedSID=null;gameMode='play';if(st.mode==='title'||!st.mode){state.mode='explore';}render();api('restore',{state:st}).then(d=>{}).catch(()=>{});}catch(e){console.error(e);try{localStorage.removeItem('cq_save');}catch(_){}}}
function mainMenu(){clearSave();SID=null;state=null;showMenu=false;gameMode='title';render();}
function confirmRestart(){if(state&&state.name){const r=confirm('Restart from the top? Your current run will be lost.');if(!r)return;}clearSave();SID=null;state=null;showMenu=false;gameMode='title';render();}
function confirmNewGame(){
  const nm=(document.getElementById('name')&&document.getElementById('name').value)||'Hero';
  if(hasLocalSave()){
    const r=confirm('Start a NEW adventure? This erases your saved progress (Room '+localSaveRoom()+').');
    if(!r) return;
  }
  api('start',{name:nm,difficulty:selDiff,class:selClass});
}
function autoResumeIfSaved(){
  try{ if(hasLocalSave() && gameMode==='title'){ continueGame(); } }catch(e){console.error(e);}
}


function clearSave(){try{localStorage.removeItem('cq_sid');}catch(e){}savedSID=null;render();}
function badgeRow(){const m={firstblood:'🩸',streak:'🔥',puzzle:'💻',explorer:'🗺️',champion:'👑'};let s='';for(const k in m){if(badges[k])s+=m[k];}return s||'—';}
function shareVictory(){
  try{
    const cvs=document.getElementById('game').querySelector('canvas');
    const url=cvs.toDataURL('image/png');
    fetch(url).then(x=>x.blob()).then(blob=>{
      const f=new File([blob],'codequest-victory.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'CodeQuest Victory!',text:(state?state.name:'Hero')+' became Champion of the Crystal Caverns!'});
      }else{const a=document.createElement('a');a.href=url;a.download='codequest-victory.png';a.click();}
    });
  }catch(e){console.error('share failed',e);const a=document.createElement('a');a.href=document.getElementById('game').querySelector('canvas').toDataURL('image/png');a.download='codequest-victory.png';a.click();}
}
// === BEST RUN (localStorage) ===
function loadBest(){try{const b=localStorage.getItem('cq_best');if(b){const o=JSON.parse(b);if(o&&typeof o.rooms==='number')bestRun=o;}}catch(e){}}
function loadBadges(){try{const b=localStorage.getItem('cq_badges');if(b){const o=JSON.parse(b);if(o&&typeof o==='object')badges=o;}}catch(e){}}
function saveBadges(){try{localStorage.setItem('cq_badges',JSON.stringify(badges));}catch(e){}}
function earnBadge(id,name){if(badges[id])return;badges[id]=true;saveBadges();badgeMsg='🏅 '+name;badgeMsgLife=1;sfxCorrect();}
function saveBest(rooms,level){try{if(rooms>bestRun.rooms||(rooms===bestRun.rooms&&level>bestRun.level)){bestRun={rooms,level};localStorage.setItem('cq_best',JSON.stringify(bestRun));}}catch(e){}}
// Touch: tap the canvas during a fight to focus/submit answer (one-thumb play)
if(cv){cv.style.touchAction='manipulation';cv.addEventListener('pointerdown',()=>{
  if(gameMode==='battle'||gameMode==='boss'){const a=document.getElementById('answer');if(a){a.focus();if(a.value)doAnswer();}}
});}
loadBest();
loadBadges();
try{savedSID=localStorage.getItem('cq_sid');}catch(e){}
loadSettings();
render();
autoResumeIfSaved();
// === PLACEHOLDER / FALLBACK SYSTEM ===
// High-contrast colored primitive drawn when a real draw call fails, so the game
// state is ALWAYS visually confirmed (never a silent black void).
function placeholderBox(x,y,w,h,color,label){
  try{
    ctx.save();
    ctx.fillStyle=color; ctx.fillRect(x-w/2,y-h/2,w,h);
    ctx.lineWidth=3; ctx.strokeStyle='#ffffff'; ctx.strokeRect(x-w/2,y-h/2,w,h);
    ctx.fillStyle='#000'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(label||'', x, y+4);
    ctx.restore();
  }catch(_){}
}
function drawFrameError(e){
  try{
    ctx.save();
    ctx.fillStyle='rgba(20,0,30,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.lineWidth=6; ctx.strokeStyle='#ff00ff'; ctx.strokeRect(8,8,W-16,H-16);
    ctx.fillStyle='#ff3df5'; ctx.font='bold 22px system-ui'; ctx.textAlign='center';
    ctx.fillText('RENDER ERROR', W/2, H*0.45);
    ctx.fillStyle='#ffd1ff'; ctx.font='13px system-ui';
    const msg=(e&&e.message)?e.message:String(e);
    ctx.fillText(msg.slice(0,60), W/2, H*0.45+24);
    ctx.fillStyle='#fff'; ctx.font='11px system-ui';
    ctx.fillText('Game state preserved — see console.', W/2, H*0.45+44);
    ctx.restore();
    console.error('[drawFrameError]', e);
  }catch(_){}
}
function drawPlayer(x,y,scl,hit,attacking,heroClass){
  try{drawPlayerReal(x,y,scl,hit,attacking,heroClass);}
  catch(e){placeholderBox(x,y,40*scl,60*scl,'#00e5ff','HERO');console.error('drawPlayer',e);}
}
function drawMonster(x,y,scl,type,hit,attacking,phase,draw){
  try{drawMonsterReal(x,y,scl,type,hit,attacking,phase,draw);}
  catch(e){placeholderBox(x,y,50*scl,50*scl,'#ff1744','FOE');console.error('drawMonster',e);}
}
function drawCavernBg(){
  try{drawCavernBgReal();}
  catch(e){placeholderBox(W/2,H/2,W,H*0.4,'#1a0033','BG');console.error('drawCavernBg',e);}
}
</script>
