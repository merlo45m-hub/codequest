<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
#game{position:relative;width:100vw;max-width:480px;margin:0 auto;height:100vh;max-height:800px;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.clickable{pointer-events:auto}
.hud{position:absolute;top:0;left:0;right:0;padding:4px 6px;display:flex;gap:3px;flex-wrap:wrap;font-size:10px;font-weight:bold}
.hud .chip{background:rgba(0,0,0,0.65);padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px)}
.hud .chip.hp{flex:1;min-width:70px}
.hp-mini{width:55px;height:4px;background:#333;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:3px}
.hp-mini-fill{height:100%;background:#2ecc71;transition:width .4s}
.hp-mini-fill.low{background:#e74c3c}
.hp-mini-fill.mid{background:#f39c12}
.hud2{position:absolute;top:24px;left:0;right:0;padding:0 6px;display:flex;gap:3px;flex-wrap:wrap;font-size:10px;font-weight:bold}
.hud2 .chip{background:rgba(0,0,0,0.65);padding:2px 7px;border-radius:5px}
.hud .chip{background:rgba(0,0,0,0.6);padding:3px 8px;border-radius:14px;font-size:0.72em;font-weight:bold;border:1px solid rgba(255,255,255,0.08)}
.barwrap{position:absolute;left:6px;right:6px;top:48px;display:flex;align-items:center;gap:6px;font-size:9px;font-weight:bold}
.barlabel{width:20px;color:#69f0ae;text-shadow:0 1px 2px #000}
.bar{position:relative;flex:1;height:13px;background:rgba(0,0,0,0.6);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.barfill{height:100%;background:linear-gradient(90deg,#2ecc71,#38ef7d);transition:width .4s;border-radius:7px}
.barfill.mid{background:linear-gradient(90deg,#f39c12,#f1c40f)}
.barfill.low{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}
.bar.xp{height:10px}
.barfillx{height:100%;background:linear-gradient(90deg,#7c4dff,#b388ff);transition:width .4s;border-radius:7px}
.barnum{width:auto;color:#ccc;text-shadow:0 1px 2px #000;min-width:54px;text-align:right}
.panel{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(8,8,24,0.95);border-radius:12px;padding:10px;border:1px solid rgba(100,100,255,0.15);backdrop-filter:blur(8px)}
.panel.title-screen{top:50%;transform:translateY(-50%);bottom:auto;text-align:center;background:linear-gradient(160deg,rgba(20,12,45,0.92),rgba(8,8,24,0.95));border:1px solid rgba(124,77,255,0.35);box-shadow:0 0 40px rgba(124,77,255,0.25)}
.game-logo{font-size:1.7em;font-weight:bold;margin:0 0 2px;background:linear-gradient(90deg,#4dd0e1,#b388ff,#ff8a80);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;animation:logopulse 2.4s ease-in-out infinite}
@keyframes logopulse{0%,100%{filter:drop-shadow(0 0 6px rgba(124,77,255,0.5));transform:scale(1)}50%{filter:drop-shadow(0 0 18px rgba(124,77,255,0.9));transform:scale(1.03)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 4px rgba(77,208,225,0.5)}50%{box-shadow:0 0 16px rgba(77,208,225,0.95)}}
.game-tag{font-size:0.78em;color:#80deea;margin-bottom:10px;letter-spacing:2px;text-transform:uppercase}
.diff-row{display:flex;gap:5px;margin:6px 0}
.diff-btn{flex:1;padding:9px 4px;border-radius:9px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#ccc;font-size:0.72em;font-weight:bold;cursor:pointer;transition:all .15s}
.diff-btn.sel{border-color:#7c4dff;background:rgba(124,77,255,0.25);color:#fff;box-shadow:0 0 12px rgba(124,77,255,0.4)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.82em;color:#ddd;margin:6px 0}
.btn-begin{background:linear-gradient(135deg,#00f260,#0575E6);color:#fff;font-size:1.05em;padding:14px;box-shadow:0 4px 16px rgba(5,117,230,0.4)}
.panel h2{font-size:1.1em;margin-bottom:6px;color:#4dd0e1}
.panel p{font-size:0.8em;color:#888;margin-bottom:6px;line-height:1.4}
.panel input,.panel select{width:100%;padding:10px;border-radius:8px;border:2px solid #333;background:rgba(0,0,0,0.5);color:#fff;font-size:0.95em;margin:3px 0}
.panel input:focus{border-color:#0575E6;outline:none}
.btn{display:block;width:100%;padding:11px;border:none;border-radius:10px;font-size:0.95em;font-weight:bold;cursor:pointer;margin:3px 0;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#00f260,#0575E6);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
.btn-success{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
.btn-secondary{background:rgba(255,255,255,0.1);color:#ccc}
.math-box{text-align:center;margin:6px 0}
.math-cat{font-size:0.72em;color:#82b1ff;margin-bottom:2px}
.math-q{font-size:1.25em;font-weight:bold}
.code-block{background:rgba(0,0,0,0.5);border-radius:8px;padding:8px;margin:5px 0;font-family:monospace;font-size:0.9em;color:#80cbc4}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}
.shop-item{background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:transform .2s}
.shop-item:active{transform:scale(.95)}
.shop-item .nm{font-size:0.75em;color:#ddd}
.shop-item .pr{font-size:0.7em;color:#ffd54f}
.msg{padding:7px;border-radius:8px;margin:5px 0;font-weight:bold;text-align:center;font-size:0.78em}
.msg-info{background:rgba(100,100,255,0.15);color:#82b1ff}
.msg-hit{background:rgba(0,255,100,0.15);color:#69f0ae}
.msg-miss{background:rgba(255,50,50,0.15);color:#ff8a80}
.msg-victory{background:rgba(255,215,0,0.15);color:#ffd54f}
.msg-defeat{background:rgba(255,50,50,0.25);color:#ff8a80}
.msg-treasure{background:rgba(255,215,0,0.15);color:#ffd54f}
.story-box{background:rgba(100,80,150,0.12);border-radius:8px;padding:7px;margin:4px 0;border-left:3px solid #7c4dff}
.story-t{font-size:0.82em;font-weight:bold;color:#b39ddb}
.story-x{font-size:0.7em;color:#9fa8da;font-style:italic;line-height:1.3}
</style>

<script>

// CODEQUEST OFFLINE ENGINE (ported from server.py — no server needed)
const MONSTERS=[
 {"name":"Slime","emoji":"\ud83d\udfe2","hp":20,"atk":5,"xp":10,"min_level":1},
 {"name":"Bat Swarm","emoji":"\ud83e\udd87","hp":30,"atk":8,"xp":15,"min_level":1},
 {"name":"Goblin Scout","emoji":"\ud83d\udc7a","hp":40,"atk":10,"xp":20,"min_level":2},
 {"name":"Stone Golem","emoji":"\ud83d\udc7f","hp":60,"atk":15,"xp":30,"min_level":3},
 {"name":"Fire Imp","emoji":"\ud83d\udd25","hp":50,"atk":18,"xp":35,"min_level":3},
 {"name":"Ice Wraith","emoji":"\ud83d\udc7b","hp":70,"atk":20,"xp":40,"min_level":4},
 {"name":"Shadow Knight","emoji":"\u2694\ufe0f","hp":90,"atk":25,"xp":55,"min_level":5},
 {"name":"Dragon Whelp","emoji":"\ud83d\udc09","hp":120,"atk":30,"xp":70,"min_level":6},
 {"name":"Crystal Titan","emoji":"\ud83d\udc8e","hp":300,"atk":40,"xp":150,"min_level":8}
];
const CODING_PUZZLES=[
 {"level":1,"prompt":"Print the number 42 to open the gate.","code":"print(____)","answer":"42","hint":"Just type 42","explain":"print() shows text."},
 {"level":2,"prompt":"Variable 'score' = 100.","code":"____ = 100","answer":"score","hint":"Name on left of =","explain":"Variables store data."},
 {"level":3,"prompt":"Add 5 and 10.","code":"print(5 ____ 10)","answer":"+","hint":"Add symbol?","explain":"+ adds."},
 {"level":4,"prompt":"Is 7 greater than 3?","code":"print(7 ____ 3)","answer":">","hint":"Greater-than symbol?","explain":"> compares."},
 {"level":5,"prompt":"Multiply 6 by 7.","code":"print(6 ____ 7)","answer":"*","hint":"Multiply symbol?","explain":"* multiplies."},
 {"level":6,"prompt":"List 1,2,3","code":"nums = ____","answer":"[1, 2, 3]","hint":"Use [ ]","explain":"Lists hold items."},
 {"level":7,"prompt":"Length of 'dragon'","code":"print(____('dragon'))","answer":"len","hint":"Length function?","explain":"len() returns length."},
 {"level":8,"prompt":"Loop 0 to 4","code":"for i in ____(5):","answer":"range","hint":"Sequence generator?","explain":"range() makes sequences."},
 {"level":9,"prompt":"name = word hero","code":"____ = \"hero\"","answer":"name","hint":"Label for the word","explain":"Strings in quotes."},
 {"level":10,"prompt":"Is 10 equal to 10?","code":"print(10 ____ 10)","answer":"==","hint":"Two equals = same?","explain":"== compares equality."},
 {"level":11,"prompt":"Join cat and dog with +","code":"print(\"cat\" ____ \"dog\")","answer":"+","hint":"+ joins strings","explain":"+ concatenates text."},
 {"level":12,"prompt":"List of three colors","code":"colors = [____, ____, ____]","answer":"\"red\", \"green\", \"blue\"","hint":"Commas inside [ ]","explain":"Lists hold values."}
];
const DIFFICULTY={"easy":{"max":20,"neg":false,"frac":false,"xp_mult":1.2},"normal":{"max":100,"neg":false,"frac":true,"xp_mult":1.0},"hard":{"max":500,"neg":true,"frac":true,"xp_mult":0.8}};
function gcd(a,b){while(b){let t=a%b;a=b;b=t;}return a;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(x){return x[Math.floor(Math.random()*x.length)];}
const SPELLS=[
 {name:"Spark Bolt",color:"#4dd0e1",mult:1.0,desc:"steady",cat:"Arithmetic",type:"arcane"},
 {name:"Flame Burst",color:"#ff7043",mult:1.6,desc:"big hit",cat:"Multiplication",type:"fire"},
 {name:"Frost Lance",color:"#4dd0e1",mult:1.25,desc:"strong",cat:"Division",type:"ice"},
 {name:"Stone Smash",color:"#a1887f",mult:1.4,desc:"heavy",cat:"Addition",type:"arcane"},
 {name:"Venom Spray",color:"#9ccc65",mult:1.15,desc:"toxic",cat:"Subtraction",type:"arcane"},
 {name:"Shadow Strike",color:"#ab47bc",mult:1.8,desc:"risky!",cat:"Power",type:"lightning"}
];
function roll_spells(mathCat){
 const map={Arithmetic:"Spark Bolt",Multiplication:"Flame Burst",Division:"Frost Lance",Addition:"Stone Smash",Subtraction:"Venom Spray",Power:"Shadow Strike"};
 const primary=map[mathCat]||"Spark Bolt";
 const pool=SPELLS.filter(s=>s.name!==primary);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const picks=[SPELLS.find(s=>s.name===primary)].concat(pool.slice(0,2));
 return picks;
}
function gen_math(difficulty,pl){
 const cfg=DIFFICULTY[difficulty];const mx=cfg.max;
 let types=["addition","subtraction"];
 if(pl>=2)types.push("multiplication");
 if(pl>=3)types.push("division");
 if(pl>=4)types.push("algebra");
 if(pl>=5&&cfg.frac)types.push("fractions");
 const t=pick(types);
 if(t==="addition"){const a=rnd(1,mx),b=rnd(1,mx);return{q:a+" + "+b+"?",a:String(a+b),cat:"Addition"};}
 if(t==="subtraction"){const a=rnd(1,mx),b=rnd(1,cfg.neg?mx:a);return{q:a+" - "+b+"?",a:String(a-b),cat:"Subtraction"};}
 if(t==="multiplication"){const a=rnd(2,Math.min(20,mx/5|0)),b=rnd(2,Math.min(15,mx/10|0));return{q:a+" x "+b+"?",a:String(a*b),cat:"Multiplication"};}
 if(t==="division"){const b=rnd(2,12),r=rnd(2,mx/b|0);return{q:(b*r)+" / "+b+"?",a:String(r),cat:"Division"};}
 if(t==="algebra"){
   if(difficulty!=="hard"){const x=rnd(1,mx),b=rnd(1,mx);
     if(Math.random()<0.5)return{q:"If x + "+b+" = "+(x+b)+", what is x?",a:String(x),cat:"Algebra"};
     return{q:"If x - "+b+" = "+x+", what is x?",a:String(x+b),cat:"Algebra"};}
   const x=rnd(2,20),c=rnd(2,5),k=rnd(1,10);return{q:"If "+c+"x + "+k+" = "+(c*x+k)+", what is x?",a:String(x),cat:"Algebra"};}
 const ds=[2,4,3,6,8];const d1=pick(ds);const d2=pick(ds.filter(d=>d!==d1));
 const lcm=d1*d2/gcd(d1,d2);const n1=rnd(1,d1-1),n2=rnd(1,d2-1);
 return{q:"What is "+n1+"/"+d1+" + "+n2+"/"+d2+"? (as fraction)",a:(n1*(lcm/d1)+n2*(lcm/d2))+"/"+lcm,cat:"Fractions"};
}
function spawn_monster(level,boss){
 if(boss)return{name:"Crystal Titan",emoji:"\ud83d\udc8e",hp:300+level*50,max_hp:300+level*50,atk:35+level*5,xp:500};
 const avail=MONSTERS.filter(m=>m.min_level<=level+1&&m.name!=="Crystal Titan");
 const t=pick(avail);const scale=1+(level-t.min_level)*0.15;
 return{name:t.name,emoji:t.emoji,hp:Math.round(t.hp*scale),max_hp:Math.round(t.hp*scale),atk:Math.round(t.atk*scale),xp:Math.round(t.xp*scale)};
}
const CLASSES={
 mage:{name:"Mage",glyph:"X",color:"#8b5cf6",emoji:"*",hp:80,atk:13,spell_mult:1.25,special:"overload",desc:"Glass cannon. +25% spell dmg. Special OVERLOAD: next spell x2."},
 knight:{name:"Knight",glyph:"S",color:"#f59e0b",emoji:"#",hp:140,atk:9,spell_mult:1.0,special:"bulwark",desc:"Tank. 140hp. Special BULWARK: heal 30% + no dmg next hit."},
 ranger:{name:"Ranger",glyph:"R",color:"#22c55e",emoji:"@",hp:110,atk:11,spell_mult:1.1,special:"multishot",desc:"Balanced. +10% spell dmg. Special MULTISHOT: hit twice."},
 healer:{name:"Healer",glyph:"H",color:"#06b6d4",emoji:"+",hp:100,atk:8,spell_mult:1.0,special:"great_heal",desc:"Support. Regen 6hp/turn. Special GREAT HEAL: +40% hp."}
};
const SPECIAL_NAMES={overload:"OVERLOAD",bulwark:"BULWARK",multishot:"MULTISHOT",great_heal:"GREAT HEAL"};
function apply_class(g,cls){const c=CLASSES[cls]||CLASSES.knight;g.hero_class=cls;g.class_name=c.name;g.class_color=c.color;g.class_emoji=c.emoji;g.max_hp=c.hp;g.hp=c.hp;g.attack=c.atk;g.spell_mult=c.spell_mult;g.special=c.special;g.special_ready=true;g.special_armed=false;g.bulwark_active=false;g.regen=(cls==="healer")?6:0;return g;}
function new_game(name,difficulty){return{name:name||"Hero",hp:100,max_hp:100,level:1,xp:0,xp_to_next:50,gems:0,potions:3,attack:10,difficulty:difficulty||"normal",battles_won:0,puzzles_solved:0,math_solved:0,rooms_cleared:0,streak:0,best_streak:0,story_stage:0,mode:"explore",monster:null,current_problem:null,current_puzzle:null,puzzle_attempts:0,battle_round:0,message:"",message_type:"info",choices:null,boss_phase:0,last_spell:"",fork_left:"",fork_right:"",hero_class:"knight",class_name:"Knight",class_color:"#f59e0b",class_emoji:"#",special:"bulwark",special_ready:true,special_armed:false,bulwark_active:false,regen:0,spell_mult:1.0};}
function get_story_for_room(r){const t={1:0,3:1,6:2,10:3,14:4};return t[r]!==undefined?t[r]:null;}
function check_levelup(g){while(g.xp>=g.xp_to_next){g.xp-=g.xp_to_next;g.level++;g.max_hp+=20;g.hp=g.max_hp;g.attack+=5;g.potions++;g.xp_to_next=Math.round(g.xp_to_next*1.5);g.message="LEVEL UP! Now level "+g.level+"!";g.message_type="levelup";}}
function engine_action(g,action,params){
 params=params||{};
 if(action==="start"){g=new_game(params.name,params.difficulty);apply_class(g,params.class||"knight");const st=get_story_for_room(0);if(st!==null)g.story_stage=st;g.message="Welcome, "+g.name+" the "+g.class_name+"!";return g;}
 if(action==="explore"){
   if(["battle","boss","puzzle","shop","fork"].includes(g.mode)){g.message="Finish it first.";g.message_type="miss";return g;}
   g.message="";g.message_type="info";const room=g.rooms_cleared+1;const stage=get_story_for_room(room);
   if(stage!==null){g.story_stage=stage;if(stage>=4){g.mode="boss";g.monster=spawn_monster(g.level,true);g.battle_round=0;g.current_problem=gen_math(g.difficulty,g.level+2);g.choices=roll_spells(g.current_problem.cat);g.boss_phase=1;return g;}}
   if(g.story_stage>=4&&g.story_stage<5&&room>=14){g.mode="boss";g.monster=spawn_monster(g.level,true);g.battle_round=0;g.current_problem=gen_math(g.difficulty,g.level+2);g.choices=roll_spells(g.current_problem.cat);g.boss_phase=1;return g;}
   const roll=Math.random();
   if(roll<0.45){g.mode="battle";g.monster=spawn_monster(g.level);g.battle_round=0;g.special_ready=true;g.special_armed=false;g.current_problem=gen_math(g.difficulty,g.level);g.choices=roll_spells(g.current_problem.cat);g.message=g.monster.emoji+" Wild "+g.monster.name+"!";}
   else if(roll<0.70){const lvl=Math.min(g.level,CODING_PUZZLES.length);g.current_puzzle=Object.assign({},CODING_PUZZLES[lvl-1]);g.puzzle_attempts=0;g.mode="puzzle";}
   else if(roll<0.82){const gems=rnd(3,10);g.gems+=gems;if(Math.random()<0.4){g.potions++;g.message="Treasure! +"+gems+" gems, +1 potion!";}else{g.message="Treasure! +"+gems+" gems!";}g.message_type="treasure";g.rooms_cleared++;}
   else if(roll<0.92){const heal=Math.round(g.max_hp*0.3);g.hp=Math.min(g.max_hp,g.hp+heal);g.message="Rest. +"+heal+" HP.";g.rooms_cleared++;}
   else if(Math.random()<0.15&&room<14&&g.story_stage<4){const opts=["treasure","battle","rest","puzzle"];for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}g.mode="fork";g.fork_left=opts[0];g.fork_right=opts[1];}
   else{g.mode="shop";}
   return g;
 }
 if(action==="answer"){
   const ans=(params.answer||"").trim();
   if(g.mode==="battle"||g.mode==="boss"){
     const prob=g.current_problem;
     if(ans.toLowerCase()===prob.a.toLowerCase()){
       let dmg=g.attack+rnd(0,5);g.streak++;g.best_streak=Math.max(g.best_streak,g.streak);g.math_solved++;
const ch=g.choices;if(ch&&params.choice!==undefined&&params.choice!==null){const ci=params.choice;if(ci>=0&&ci<ch.length){dmg=Math.round(dmg*ch[ci].mult*g.spell_mult);g.last_spell=ch[ci].name;}}if(g.special_armed&&g.special_ready){if(g.special==="overload"){dmg*=2;g.special_ready=false;g.special_armed=false;g.message="OVERLOAD! x2!";g.message_type="special";}else if(g.special==="bulwark"){g.bulwark_active=true;g.special_ready=false;g.special_armed=false;const hl=Math.round(g.max_hp*0.3);g.hp=Math.min(g.max_hp,g.hp+hl);g.message="BULWARK! +"+hl+" HP";g.message_type="special";}else if(g.special==="multishot"){dmg*=2;g.special_ready=false;g.special_armed=false;g.message="MULTISHOT! Double!";g.message_type="special";}else if(g.special==="great_heal"){const hl=Math.round(g.max_hp*0.4);g.hp=Math.min(g.max_hp,g.hp+hl);g.special_ready=false;g.special_armed=false;g.message="GREAT HEAL! +"+hl+" HP";g.message_type="special";}}
       if(g.streak>=3){const bonus=g.streak*2;dmg+=bonus;g.message="STREAK x"+g.streak+"! +"+bonus+"!";}else{g.message="Correct! "+dmg+" dmg!";}
       g.monster.hp-=dmg;g.message_type="hit";
       if(g.monster.hp<=0){const xp=Math.round(g.monster.xp*DIFFICULTY[g.difficulty].xp_mult);const gems=rnd(1,3);g.xp+=xp;g.gems+=gems;g.battles_won++;const wasb=g.mode==="boss";g.mode="explore";g.rooms_cleared++;if(wasb){g.story_stage=5;g.message="CHAMPION! You defeated the Crystal Titan!";}else{g.message="Victory! +"+xp+" XP, +"+gems+" gems!";}g.message_type="victory";check_levelup(g);return g;}
     } else {const m_dmg=g.monster.atk+rnd(0,3);g.hp-=m_dmg;if(g.regen)g.hp=Math.min(g.max_hp,g.hp+g.regen);if(g.bulwark_active){m_dmg=0;g.bulwark_active=false;g.message="BULWARK absorbed the blow!";g.message_type="special";}else{g.streak=0;g.message="Wrong! Was "+prob.a+". -"+m_dmg+" HP";g.message_type="miss";}if(g.hp<=0){g.hp=0;g.mode="gameover";g.message="Defeated!";g.message_type="defeat";return g;}g.battle_round++;}

let audioCtx=null;

function beep(freq,dur,type='square',vol=0.15){
  if(!audioCtx||!settings.sfx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
// === AMBIENT SOUNDTRACK (muted by default; toggle with 🔊) ===
let musicOn=false, musicNodes=null, currentMusicBiome='cavern';
function startMusic(biome){try{
  if(!audioCtx)return;
  if(musicNodes)stopMusic();
  const b=biome||currentMusicBiome||'cavern';
  const notes=b==='ruins'?[130.81,196.0]:[110.0,130.81]; // ruins: bright C major-ish; cavern: darker A minor-ish
  const pad=audioCtx.createGain();pad.gain.value=0.0;pad.connect(audioCtx.destination);
  const o1=audioCtx.createOscillator();o1.type='sine';o1.frequency.value=notes[0];
  const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=notes[1];
  const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.07;
  const lfoG=audioCtx.createGain();lfoG.gain.value=0.018;lfo.connect(lfoG);lfoG.connect(pad.gain);
  o1.connect(pad);o2.connect(pad);
  o1.start();o2.start();lfo.start();
  pad.gain.linearRampToValueAtTime(0.05,audioCtx.currentTime+2);
  musicNodes={pad,o1,o2,lfo};currentMusicBiome=b;
}catch(e){}}
function setMusicBiome(b){if(!b||b===currentMusicBiome)return;if(musicOn){startMusic(b);}else{currentMusicBiome=b;}}
function stopMusic(){if(musicNodes){try{musicNodes.pad.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);}catch(e){} musicNodes=null;}}

// AUDIO & JUICE: synthesized spell-cast + button-click SFX (Web Audio API)
function sfxCast(type){
  if(!audioCtx||!settings.sfx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  const tp=(type==='fire')?'sawtooth':(type==='ice')?'sine':(type==='lightning')?'square':'triangle';
  const f0=(type==='ice')?700:(type==='lightning')?500:(type==='fire')?240:380;
  const f1=(type==='ice')?1500:(type==='lightning')?1400:(type==='fire')?520:900;
  o.type=tp;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+0.13);
  g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.16);
}
function sfxClick(){
  if(!audioCtx||!settings.sfx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.setValueAtTime(1250,t);o.frequency.exponentialRampToValueAtTime(700,t+0.03);
  g.gain.setValueAtTime(0.10,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.05);
}

function drawBiomeSilhouette(depth){
  ctx.save();
  const off=(bgOffset*0.25)%W;
  if(depth<=1){
    ctx.fillStyle='rgba(90,140,220,0.30)';
    for(let i=-1;i<5;i++){const bx=i*W/3 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.lineTo(bx+W/8,H*0.10);ctx.lineTo(bx+W/4,H*0.5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(bx+W/12,H*0.5);ctx.lineTo(bx+W/8,H*0.22);ctx.lineTo(bx+W/5,H*0.5);ctx.closePath();ctx.fill();}
  }else if(depth<=3){
    ctx.strokeStyle='rgba(80,180,90,0.35)';ctx.lineWidth=3;
    for(let i=-1;i<6;i++){const bx=i*W/3.5 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.quadraticCurveTo(bx+W/8,H*0.15,bx+W/4,H*0.5);ctx.stroke();}
    ctx.fillStyle='rgba(120,220,120,0.30)';
    for(let i=0;i<5;i++){const bx=((i*W/4 - off)%(W+40));let x=bx;if(x<-20)x+=W+40;
      ctx.beginPath();ctx.ellipse(x,H*0.46,W/28,7,0,Math.PI,0);ctx.fill();}
  }else if(depth<=5){
    ctx.fillStyle='rgba(150,210,240,0.32)';
    for(let i=-1;i<6;i++){const bx=i*W/3 - off;
      ctx.beginPath();ctx.moveTo(bx,H*0.5);ctx.lineTo(bx+W/6,H*0.18);ctx.lineTo(bx+W/3,H*0.5);ctx.closePath();ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<24;i++){const sx=((i*53+animTime*8)%W);const sy=((i*91+animTime*20)%H);ctx.globalAlpha=0.4+Math.sin(animTime+i)*0.2;ctx.beginPath();ctx.arc(sx,sy,1.4,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='rgba(120,110,140,0.32)';
    for(let i=-1;i<6;i++){const bx=i*W/3 - off;const ph=20+Math.abs(Math.sin(i*2.1))*30;
      ctx.fillRect(bx,H*0.5-ph,W/22,ph);
      ctx.fillRect(bx+W/3-W/22,H*0.5-(ph*0.6),W/22,ph*0.6);}
    ctx.strokeStyle='rgba(155,89,182,0.28)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W/2,H*0.5,W*0.22,Math.PI,0);ctx.stroke();
  }
  ctx.restore();
}
function drawCavernBg(){
  let depth=state?Math.min(7,Math.floor(state.rooms_cleared/3)):0;
  curBiome=depth>=3?'ruins':'cavern';
  setMusicBiome(curBiome);
  const palettes=[
    ['#0a0a2a','#1a1a4e','#0a0a1a'],['#0a1a0a','#1a3a10','#0a0f0a'],
    ['#1a0a2a','#3a1050','#0f0010'],['#0a1a2a','#003040','#000510'],
    ['#1a0000','#3a0000','#1f0000'],['#0a001a','#200040','#100010'],
    ['#001a0a','#103a10','#000500'],['#1a1000','#3a2000','#1f0500']];
  const p=palettes[depth]||palettes[7];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p[0]);g.addColorStop(0.5,p[1]);g.addColorStop(1,p[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // FAR layer: parallax mountain/crystal silhouettes (slow)
  ctx.save();
  const farOff=(bgOffset*0.15)%W;
  ctx.globalAlpha=0.35;
  ctx.fillStyle=p[0];
  for(let i=-1;i<5;i++){
    const bx=i*W/3 - farOff;
    ctx.beginPath();ctx.moveTo(bx,H*0.45);
    ctx.lineTo(bx+W/6,H*0.30);ctx.lineTo(bx+W/3,H*0.45);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // MID layer: floating crystal clusters (medium parallax) + glow
  ctx.save();
  const midOff=(bgOffset*0.4)%W;
  const cset=[['#4dd0e1','#ce93d8','#80cbc4','#7c4dff','#ffd54f'],['#a5d6a7','#ffab91','#80cbc4','#ce93d8','#fff59d'],['#ce93d8','#b39ddb','#9fa8da','#7986cb','#d1c4e9'],['#4fc3f7','#4dd0e1','#80deea','#b2ebf2','#e0f7fa'],['#ff8a80','#ffab91','#ffcc80','#ffe0b2','#fff3e0'],['#b39ddb','#ce93d8','#e1bee7','#f3e5f5','#f8bbd0'],['#a5d6a7','#81c784','#66bb6a','#4caf50','#388e3c'],['#ff8a80','#ffab91','#ffcc80','#ffe0b2','#ffecb3']];
  const c=cset[depth%cset.length];
  const cl=[[0.08,0.55,10,c[0]],[0.30,0.48,7,c[1]],[0.55,0.6,9,c[2]],[0.78,0.5,6,c[3]],[0.92,0.62,8,c[4]]];
  for(const[cx,cy,sz,col]of cl){
    let x=((W*cx - midOff)%(W+40));if(x<-20)x+=W+40;
    const y=H*cy;const glow=0.3+Math.sin(animTime+cx*10)*0.15;
    ctx.globalAlpha=glow*0.3;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-sz/2,sz*1.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=glow;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x-sz/2,y);ctx.lineTo(x+sz/2,y);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // NEAR layer: stalactites from top + stalagmites from floor (fast parallax)
  ctx.save();
  const nearOff=(bgOffset*0.8)%(W+40);
  let stColor='rgba(30,20,60,0.5)',stCount=8;
  switch(depth){case 0:stColor='rgba(30,20,60,0.5)';stCount=8;break;case 1:stColor='rgba(20,50,20,0.5)';stCount=10;break;case 2:stColor='rgba(40,20,60,0.5)';stCount=6;break;case 3:stColor='rgba(20,40,60,0.5)';stCount=12;break;case 4:stColor='rgba(50,20,20,0.5)';stCount=9;break;case 5:stColor='rgba(40,10,60,0.5)';stCount=7;break;case 6:stColor='rgba(30,60,30,0.5)';stCount=11;break;case 7:stColor='rgba(60,40,20,0.5)';stCount=8;break;}
  ctx.fillStyle=stColor;
  for(let i=0;i<stCount;i++){

  }

  const flC=['rgba(15,10,30,0.6)','rgba(10,20,15,0.6)','rgba(20,10,30,0.6)','rgba(10,15,35,0.6)','rgba(30,10,15,0.6)','rgba(20,10,35,0.6)','rgba(10,30,15,0.6)','rgba(30,20,10,0.6)'];

  // Glowing crystals (foreground sparkle)
  for(const[cx,cy,sz,col]of [[0.1,0.6,8,c[0]],[0.85,0.55,6,c[1]],[0.2,0.75,5,c[2]],[0.7,0.8,7,c[3]],[0.5,0.5,4,c[4]]]){
    const x=W*cx,y=H*cy;const glow=0.3+Math.sin(animTime+cx*10)*0.15;
    ctx.globalAlpha=glow;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x-sz/2,y);ctx.lineTo(x+sz/2,y);ctx.closePath();ctx.fill();
    ctx.globalAlpha=glow*0.3;ctx.beginPath();ctx.arc(x,y-sz/2,sz*1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // LIVING WORLD: roaming critters behind actors
  if(!settings.reducedMotion){drawBiome();drawCritters();}

  // Floating dust
  for(let i=0;i<25;i++){
    const px=(i*37+animTime*15)%(W+20)-10;

}

  ctx.fillRect(-1,-h/2,2,h); // vertical trim

  ctx.fillStyle='#ffd700';ctx.fillRect(-3,-2,6,6);
  ctx.fillStyle='#000';ctx.fillRect(-1,0,2,3);

  if(chestOpen){

    ctx.globalAlpha=1;

    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();

  for(let i=dmgNums.length-1;i>=0;i--){

    const sc=1+(d.pop>0?d.pop*0.6:0);
    ctx.save();ctx.translate(d.x,d.y);ctx.scale(sc,sc);
    ctx.globalAlpha=Math.min(1,d.life*1.4);ctx.textAlign='center';
    if(d.crit){ctx.shadowColor=d.color;ctx.shadowBlur=12;}
    ctx.font='bold '+d.size+'px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#000';

// === LIVING WORLD: roaming critters + day/night ===
let critters=[];
let curBiome='cavern';
let camZoom=1, camTarget=1, camPanX=0, camPanTarget=0; // dramatic camera on monster appear
let embers=[];
function initEmbers(){embers=[];for(let i=0;i<14;i++)embers.push({x:Math.random(),y:Math.random(),vy:0.2+Math.random()*0.4,ph:Math.random()*6,vx:(Math.random()-0.5)*0.3})}
if(typeof W!=='undefined') initEmbers();
function initCritters(){
  critters=[];
  const kinds=['bat','firefly','firefly','sprite'];
  for(let i=0;i<7;i++){
    critters.push({
      x:Math.random()*W, y:0.2*H+Math.random()*0.6*H,

if(typeof W!=='undefined') initCritters();
function drawCritters(){
  for(const c of critters){

      const wf=Math.sin(animTime*8+c.ph)*0.5;
      ctx.fillStyle='#15152e';
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-10,-6-wf*6,-18,-2);ctx.quadraticCurveTo(-10,2,-5,4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(10,-6-wf*6,18,-2);ctx.quadraticCurveTo(10,2,5,4);ctx.closePath();ctx.fill();
      ctx.fillStyle='#2a2a4e';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }else{ // glowing firefly / sprite (or butterfly in ruins)
      if(curBiome==='ruins'){
        ctx.save();ctx.translate(c.x,c.y);ctx.globalAlpha=c.a;
        const bw=Math.sin(animTime*10+c.ph)*0.6;

        ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-8,-6-bw*6,-10,2);ctx.quadraticCurveTo(-4,2,0,0);ctx.fill();
        ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(8,-6-bw*6,10,2);ctx.quadraticCurveTo(4,2,0,0);ctx.fill();
        ctx.shadowBlur=0;ctx.restore();

function drawBiome(){
  if(curBiome!=='ruins')return;

  ctx.save();ctx.globalAlpha=0.10;ctx.fillStyle='#ffe082';
  for(let i=0;i<4;i++){const sx=W*(0.2+i*0.2);ctx.beginPath();ctx.moveTo(sx,H*0.1);ctx.lineTo(sx-30,H);ctx.lineTo(sx+30,H);ctx.lineTo(sx+12,H*0.1);ctx.closePath();ctx.fill();}

  ctx.restore();

function drawDayNight(){

function drawTorches(){
  // Wall torches with flickering flame + warm light pool

    const fl=0.7+Math.sin(animTime*12+fx*9)*0.2+Math.random()*0.1;
    // bracket
    ctx.fillStyle='#3a2a1a';ctx.fillRect(x-2,y,4,18);
    // light pool on floor/wall
    ctx.save();ctx.globalAlpha=0.18*fl;ctx.fillStyle='#ffb347';

    ctx.fillStyle=lp;ctx.beginPath();ctx.arc(x,y,120,0,Math.PI*2);ctx.fill();ctx.restore();

    ctx.save();ctx.translate(x,y);ctx.globalAlpha=fl;

    ctx.fillStyle='#ff7043';ctx.beginPath();ctx.ellipse(0,-6,fh*0.3,fh*0.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffca28';ctx.beginPath();ctx.ellipse(0,-8,fh*0.18,fh*0.32,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff59d';ctx.beginPath();ctx.ellipse(0,-9,fh*0.08,fh*0.18,0,0,Math.PI*2);ctx.fill();
    ctx.restore();

function drawWeather(){
  // Drifting fog banks (slow horizontal)
  ctx.save();
  for(let i=0;i<3;i++){
    const fy=H*(0.25+i*0.22);
    const fx=((animTime*(8+i*4)+i*200)% (W+300))-150;
    ctx.globalAlpha=0.05+0.02*i;
    const fg=ctx.createRadialGradient(fx,fy,10,fx,fy,180);
    fg.addColorStop(0,'rgba(200,210,255,0.6)');fg.addColorStop(1,'rgba(200,210,255,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(fx,fy,180,50,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // Rising embers (fire-themed depth ambience)
  ctx.save();
  for(const e of embers){
    e.y-=e.vy*0.004; e.x+=e.vx*0.002+Math.sin(animTime+e.ph)*0.0005;
    if(e.y<0){e.y=1;e.x=Math.random();}
    const ex=e.x*W, ey=e.y*H;
    ctx.globalAlpha=0.4+Math.sin(animTime*3+e.ph)*0.3;
    ctx.fillStyle='#ffb74d';ctx.shadowColor='#ffb74d';ctx.shadowBlur=6;

// === STATE MANAGEMENT ===

async function api(action,params={}){
  try{initAudio()}catch(e){}
  const data=offlineAct(action,params);
  onStateChange(state,data);state=data;gameMode=state.mode||'explore';
  if(state.rooms_cleared!=null)saveBest(state.rooms_cleared,state.level);
  try{localStorage.setItem('cq_offline',JSON.stringify(OFFLINE_G));}catch(e){}
  render();
}

function onStateChange(prev,curr){
  if(!prev){gameMode=curr.mode||'explore';return}
  // Mode change = room transition
  if(curr.mode!==prev.mode){roomTrans=1}
  if((curr.mode==='battle'||curr.mode==='boss')&&prev.mode!=='battle'&&prev.mode!=='boss'){monsterEnter=1;attackAnim=0;attackAnimWho=null}
  // Player damage
  if(curr.hp<prev.hp){
    const dmg=prev.hp-curr.hp;const heavy=dmg>=18;
    addShake(heavy?14:7, heavy?14:7);flashColor='#ff0000';flashAlpha=heavy?0.5:0.3;pHitFlash=1;pHurt=1;if(heavy)hitStop=Math.min(5,2+Math.floor(dmg/16));
    spawnDmg(W*0.25,H*0.38,dmg,'player',heavy);
    spawnParticles(W*0.25,H*0.42,'#ff5252',25);sfxHurt();
    attackAnim=1;attackAnimWho='monster';
  }
  // Monster damage
  if(prev.monster&&curr.monster&&curr.monster.hp<prev.monster.hp){
    const dmg=prev.monster.hp-curr.monster.hp;const heavy=dmg>=22||curr.streak>=3;
    addShake(heavy?12:7, heavy?12:7);if(heavy)hitStop=Math.min(5,1+Math.floor(dmg/16));
    spawnDmg(W*0.72,H*0.38,dmg,'monster',heavy);
    spawnParticles(W*0.72,H*0.42,'#ffd54f',30);sfxHit();mHurt=1;
    attackAnim=1;attackAnimWho='player';
    swoosh.push({x:W*0.5,y:H*0.45,life:1,color:curr.streak>=3?'#ff416c':'#4dd0e1'});
    const _st=(state&&state.choices)?state.choices[selSpell||0]:null;
    castSpell(_st?_st.color:(curr.streak>=3?'#ff416c':'#4dd0e1'), _st?_st.type:'arcane', _st?_st.mult:1);
    if(curr.streak>=3){spawnShockwave(W*0.72,H*0.42,'#ff416c');shakeTime=14;shakeMag=10;spawnCombo('STREAK x'+curr.streak+'!',curr.streak>=5?'#ff416c':'#ff9800');}
    if(curr.charged_this_hit){spawnShockwave(W*0.72,H*0.42,'#ffd54f');spawnShockwave(W*0.72,H*0.42,'#fff');flashColor='#ffd54f';flashAlpha=0.5;shakeTime=Math.max(shakeTime,12);shakeMag=Math.max(shakeMag,9);spawnCombo('\u26a1 CHARGED!',curr.streak>=5?'#ff416c':'#ffd54f');}
    for(let i=0;i<8;i++)attackTrail.push({x:W*0.25+i*12,y:H*0.45,life:1,color:curr.streak>=3?'#ff416c':'#4dd0e1'});
    for(let i=0;i<12;i++)spearTrails.push({x:W*0.25+(i*18),y:H*0.42+Math.sin(i)*5,life:1,color:'#4dd0e1'});
  }
  if(prev.monster&&(!curr.monster||curr.mode!=='battle'&&curr.mode!=='boss')&&prev.mode==='battle'){
    monsterDeath=1;spawnParticles(W*0.72,H*0.42,'#ff5252',20);spawnParticles(W*0.72,H*0.42,'#ffd54f',15);
    for(let i=0;i<15;i++)goldRain.push({x:W*0.72+(Math.random()-0.5)*40,y:H*0.4,vy:-1-Math.random()*4,size:2+Math.random()*3,color:'#ffd700',life:1});
  }
  // Level up
  if(curr.level>(prev?.level||1)){
    levelUpText='LEVEL UP!';levelUpTextLife=1;
    flashColor='#9b59b6';flashAlpha=0.5;
    spawnParticles(W*0.5,H*0.5,'#ce93d8',40);spawnShockwave(W*0.5,H*0.5,'#ce93d8');
    hitStop=6;
    sfxLevelUp();
  }
  // Treasure
  if(curr.streak>=(prev?.streak||0)+1&&curr.streak>=3){
    for(let i=0;i<8;i++){streakFire.push({x:W*0.25+(Math.random()-0.5)*30,y:H*0.3+Math.random()*20,size:3+Math.random()*3,life:1,color:curr.streak>=5?'#ff416c':'#ff9800'})}
  }
  if(curr.message_type==='treasure'){flashColor='#ffd700';flashAlpha=0.3;spawnParticles(W*0.5,H*0.4,'#ffd54f',20);sfxTreasure();chestOpen=true;chestAnim=0;for(let i=0;i<25;i++){goldRain.push({x:W/2+(Math.random()-0.5)*80,y:H*0.35,vy:-1-Math.random()*5,size:2+Math.random()*4,color:'#ffd700',life:1})}}
  // Victory
  if(curr.message_type==='victory'&&curr.mode!=='boss'){flashColor='#ffd700';flashAlpha=0.3;sfxCorrect()}
  if(curr.story_stage>=5&&prev.story_stage<5){victoryTime=1;victoryTrig=1;flashColor='#ffd700';flashAlpha=0.6;for(let i=0;i<60;i++)spawnParticles(W*0.72,H*0.45,'#ce93d8',60);for(let i=0;i<30;i++)spawnParticles(W*0.72,H*0.45,'#fff',30);spawnShockwave(W*0.72,H*0.45,'#e8a6f0');spawnShockwave(W*0.72,H*0.45,'#fff');sfxVictory();hitStop=10;shakeTime=20;shakeMag=14}
  // Correct answer
  if(prev.mode==='battle'&&curr.mode==='explore'&&curr.message_type==='victory'){sfxVictory()}
  // Wrong answer
  if(curr.message_type==='miss'&&prev.mode==='battle'){sfxWrong()}
  // Boss intro
  if(curr.mode==='boss'&&prev.mode!=='boss'){bossIntro=1;sfxBoss();addShake(13,22);spawnShockwave(W*0.5,H*0.45,'#9b59b6');for(let i=0;i<20;i++)spawnParticles(W*0.5,H*0.45,'#9b59b6',20)}
  if(curr.mode==='boss'&&prev.mode==='boss'&&(curr.boss_phase||1)>(prev.boss_phase||0)){
    bossIntro=Math.max(bossIntro,0.8);sfxBoss();addShake(16,20);flashColor='#ff1744';flashAlpha=0.6;
    spawnCombo('PHASE '+curr.boss_phase+' — ENRAGED!', curr.monster&&curr.monster.color?curr.monster.color:'#ff1744');
    for(let i=0;i<24;i++)spawnParticles(W*0.72,H*0.45,curr.monster&&curr.monster.color?curr.monster.color:'#ff1744',24);
  }
  // Death
  if(curr.mode==='gameover'){sfxDeath();addShake(16,20);flashColor='#ff0000';flashAlpha=0.6;playerDead=true;pDeath=1;pHurt=1}
  // Shop enter
  if(curr.mode==='shop'&&prev.mode!=='shop'){sfxShop()}
  // Heal
  if(curr.hp>prev.hp&&curr.message_type==='heal'){spawnHeal(W*0.25,H*0.38,curr.hp-prev.hp);sfxCorrect()}
  if(curr.battles_won>0)earnBadge('firstblood','First Blood');
  if(curr.best_streak>=5)earnBadge('streak','Streak Master');
  if(curr.puzzles_solved>0)earnBadge('puzzle','Puzzle Solver');
  if(curr.rooms_cleared>=10)earnBadge('explorer','Deep Explorer');
  if(curr.story_stage>=5)earnBadge('champion','Champion');
  gameMode=curr.mode||'explore';
}

function render(){
  if(!state){
    gameMode='title';
    ui.innerHTML=`<div class="panel title-screen clickable">
<div class="game-logo">⚔️ CODEQUEST</div>
<div class="game-tag">Crystal Caverns</div>
<p>Enter the caverns! Battle monsters with math, solve coding puzzles, and claim the Knowledge Crystal.</p>
<input type="text" id="name" placeholder="Your hero name" value="">
<div class="diff-row">
<div class="diff-btn ${selDiff==='easy'?'sel':''}" onclick="selDiff='easy';render()">Adventurer<br>8-10</div>
<div class="diff-btn ${selDiff==='normal'?'sel':''}" onclick="selDiff='normal';render()">Hero<br>10-13</div>
<div class="diff-btn ${selDiff==='hard'?'sel':''}" onclick="selDiff='hard';render()">Legend<br>13-15</div>
</div>
<button class="btn btn-begin" onclick="confirmNewGame()">⚔️ Begin Adventure</button>
${hasLocalSave()?'<div style="margin-top:6px"><button class="btn btn-success clickable" style="font-size:0.85em;width:100%" onclick="continueGame()">▶️ Continue (Room '+localSaveRoom()+')</button></div>':''}${savedSID?'<div style="margin-top:4px"><button class="btn btn-secondary clickable" style="font-size:0.8em;width:100%" onclick="resumeGame()">↺ Resume Server Run</button></div>':''}
<div style="margin-top:6px;display:flex;gap:5px"><button class="btn btn-secondary clickable" style="font-size:0.78em;flex:1" onclick="toggleMusic()">${musicOn?'🔊 Music: On':'🔇 Music: Off'}</button><button class="btn btn-secondary clickable" style="font-size:0.78em;flex:1" onclick="showSettings=true;render()">⚙️ Settings</button></div>
<div style="margin-top:6px"><button class="btn btn-info clickable" style="font-size:0.78em;width:100%" onclick="showHelp=true;render()">❓ How to Play</button></div>
<div style="text-align:center;font-size:0.72em;color:#ffd54f;margin-top:4px">🏆 Best Run: Room ${bestRun.rooms} (Lv ${bestRun.level})</div>
<div style="text-align:center;margin-top:4px;font-size:1.05em">${badgeRow()}</div>
</div>`;
    return;
  }
  const zones=['Entrance','Blue Caverns','Green Tunnels','Frozen Depths','Amethyst Halls','Titan Gate'];
  const zoneName=zones[Math.min(5,Math.floor(state.rooms_cleared/3))];
  const hpPct=(state.hp/state.max_hp)*100;
  const hpCls=hpPct>50?'':hpPct>25?'mid':'low';
  const xpPct=Math.max(0,Math.min(100,(state.xp/state.xp_to_next)*100));
function chargeChipHTML(state){
  const ch=state.charges||0, th=state.combo_threshold||3;
  let pips="";
  for(let i=0;i<th;i++){
    const on=i<ch;
    pips+="<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1.5px;background:"+(on?"#ffd54f":"rgba(255,255,255,0.18)")+";box-shadow:"+(on?"0 0 6px #ffd54f":"none")+";\"></span>";
  }
  return "<span class=\"chip\" style=\"background:rgba(255,213,79,0.18);color:#ffd54f\">\u26a1"+pips+"</span>";
}
  let hud=`<div class="hud clickable">`;
  hud+=`<span class="chip lv">⭐${state.level}</span>`;
  hud+=`<span class="chip" style="background:rgba(124,77,255,0.5)">📍 ${zoneName}</span>`;
  hud+=`<span class="chip">🗡️${state.attack}</span>`;
  hud+=`<span class="chip">🧪${state.potions}</span>`;
  hud+=`<span class="chip">💎${state.gems||0}</span>`;
  if(state.streak>0)hud+=`<span class="chip" style="background:rgba(255,65,108,0.5)">🔥${state.streak}</span>`;
  hud+=chargeChipHTML(state);
  hud+=`<span class="chip clickable" style="background:rgba(124,77,255,0.4)" onclick="toggleMusic()">${musicOn?'🔊':'🔇'}</span>`;
  hud+=`<span class="chip" style="background:rgba(255,215,0,0.25);color:#ffd54f">🏆 R${bestRun.rooms}</span>`;
  hud+=`</div>`;
  hud+=`<div class="barwrap"><div class="barlabel">HP</div><div class="bar"><div class="barfill ${hpCls}" style="width:${Math.max(0,hpPct)}%"></div></div><span class="barnum">${state.hp}/${state.max_hp}</span></div>`;
  hud+=`<div class="barwrap"><div class="barlabel" style="color:#b388ff">XP</div><div class="bar xp"><div class="barfillx" style="width:${xpPct}%"></div></div><span class="barnum">${state.xp}/${state.xp_to_next}</span></div>`;
  let panel='';
  if(state.message)panel+=`<div class="msg msg-${state.message_type}">${state.message}</div>`;
  if(state.mode==='explore'&&state.rooms_cleared<3){
    const stories=[{"stage": 0, "title": "🏔️ The Entrance", "text": "You stand at the mouth of the Crystal Caverns. Legends say ancient knowledge is buried deep within — math formulas carved in stone, code etched in crystal. Monsters guard the treasures. Only the clever may pass."}, {"stage": 1, "title": "🔵 The Blue Caverns", "text": "You descend into the first chamber. Stalactites glow with faint blue light. Slimes and bats skitter in the shadows."}, {"stage": 2, "title": "🟢 The Green Tunnels", "text": "Deeper now. The crystals shift from blue to green. Goblins patrol these tunnels. A locked door blocks the path — it needs code to open."}, {"stage": 3, "title": "❄️ The Frozen Depths", "text": "The temperature drops. Ice formations glitter on the walls. Stronger monsters dwell here."}, {"stage": 4, "title": "💎 THE CRYSTAL TITAN", "text": "You've reached the deepest chamber. A massive figure towers over you — the Crystal Titan. 'Prove your mind is worthy,' it booms."}, {"stage": 5, "title": "👑 VICTORY", "text": "The Crystal Titan crumbles into sparkling dust. The Knowledge Crystal floats toward you. You grasp it. You are the Champion of the Crystal Caverns!"}];
    const ss=stories.find(s=>s.stage===state.story_stage);
    if(ss)panel+=`<div class="story-box"><div class="story-t">${ss.title}</div><div class="story-x">${ss.text}</div></div>`;
  }
  if(state.mode==='explore'||state.mode==='rest'||state.mode==='treasure'){
    if(state.story_stage>=5){
      panel+=`<div style="text-align:center;padding:10px"><div style="color:#ffd54f;font-size:1.15em;font-weight:bold">CHAMPION!</div><p style="font-size:0.78em;color:#999;margin:4px">Battles:${state.battles_won} Puzzles:${state.puzzles_solved} Math:${state.math_solved}</p><p style="font-size:0.78em;color:#999">Best Streak:${state.best_streak}</p><button class="btn btn-info clickable" onclick="shareVictory()">📤 Share Victory</button> <button class="btn btn-primary clickable" onclick="clearSave();try{localStorage.removeItem('cq_offline');}catch(e){}OFFLINE_G=null;SID=null;state=null;render()">Play Again</button></div>`;
    }else{
      panel+=`<button class="btn btn-primary clickable" onclick="api('explore')">Explore Next Room</button>`;
      panel+=`<button class="btn btn-info clickable" onclick="showMap=!showMap;render()">🗺️ Map</button>`;
      panel+=`<button class="btn btn-success clickable" onclick="api('potion')">Use Potion (${state.potions})</button>`;
    }
  }else if(state.mode==='battle'||state.mode==='boss'){
    questionStart=performance.now();
    const p=state.current_problem;
    if(state.boss_telegraph){
      panel+=`<button class=\"btn btn-special clickable\" onclick=\"api('defend')\" style=\"margin:4px 0;width:100%;font-weight:bold;color:#9be7ff;border-color:#4dd0e1;animation:pulseGlow 0.7s infinite\">🛡 BULWARK — PARRY THE ${state.current_move||'strike'}!</button>`;
    }
    panel+=`<div class="math-box"><div class="math-cat">${p.cat}</div><div class="math-q">${p.q}</div></div>`;
    panel+=`<input type="text" id="answer" placeholder="Your answer..." onkeypress="if(event.key==='Enter')doAnswer()">`;
    panel+=`<button class="btn btn-danger clickable" onclick="doAnswer()">Attack!</button>`;
  }else if(state.mode==='puzzle'){
    const p=state.current_puzzle;
    panel+=`<div style="font-size:0.85em;color:#80cbc4;font-weight:bold;text-align:center">Coding Puzzle (Level ${p.level})</div>`;
    panel+=`<p style="font-size:0.78em;text-align:center">${p.prompt}</p>`;
    panel+=`<div class="code-block">${p.code}</div>`;
    panel+=`<p style="font-size:0.68em;color:#666;text-align:center">Fill the blank (____)</p>`;
    panel+=`<input type="text" id="answer" placeholder="Fill the blank..." onkeypress="if(event.key==='Enter')doAnswer()">`;
    panel+=`<button class="btn btn-secondary clickable" style="font-size:0.8em" onclick="showHint=!showHint;render()">💡 Hint</button>`;
    if(showHint&&state.current_puzzle&&state.current_puzzle.hint)panel+=`<div style="font-size:0.72em;color:#ffd54f;background:rgba(255,213,79,0.1);padding:5px;border-radius:6px;margin:4px 0">💡 ${state.current_puzzle.hint}</div>`;
panel+=`<button class="btn btn-primary clickable" onclick="doAnswer()">Submit</button>`;
  }else if(state.mode==='shop'){
    panel+=`<div style="text-align:center;font-size:0.9em;color:#80cbc4;margin:3px">Shop</div>`;
    panel+=`<div class="shop-grid">`;
    panel+=`<div class="shop-item clickable" onclick="doShop('1')"><div class="nm">Potion</div><div class="pr">10 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('2')"><div class="nm">ATK +3</div><div class="pr">20 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('3')"><div class="nm">MaxHP +15</div><div class="pr">30 gems</div></div>`;
    panel+=`<div class="shop-item clickable" onclick="doShop('4')" style="background:rgba(80,80,80,0.2)"><div class="nm">Leave</div><div class="pr">free</div></div>`;
    panel+=`</div>`;
  }else if(state.mode==='gameover'){
    panel+=`<div style="text-align:center;padding:12px"><div style="font-size:1.3em;color:#ff5252;font-weight:bold">GAME OVER</div><p style="font-size:0.78em;color:#999;margin:3px">${state.name} fell in the Crystal Caverns...</p><p style="font-size:0.78em;color:#999">Level ${state.level} | Battles:${state.battles_won} | Puzzles:${state.puzzles_solved}</p><p style="font-size:0.78em;color:#999">Best Streak:${state.best_streak}</p><button class="btn btn-primary clickable" onclick="clearSave();try{localStorage.removeItem('cq_offline');}catch(e){}OFFLINE_G=null;SID=null;state=null;render()">Play Again</button></div>`;
  }
  if(showSettings){
    let sp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:8px">⚙️ Settings</div>`;
    sp+=`<div class="set-row"><span>🔊 Music</span><button class="btn ${settings.music?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('music')">${settings.music?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🔔 Sound FX</span><button class="btn ${settings.sfx?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('sfx')">${settings.sfx?'On':'Off'}</button></div>`;
    sp+=`<div class="set-row"><span>🌿 Reduced Motion</span><button class="btn ${settings.reducedMotion?'btn-success':'btn-secondary'} clickable" style="flex:0 0 auto;min-width:90px" onclick="toggleSetting('reducedMotion')">${settings.reducedMotion?'On':'Off'}</button></div>`;
    sp+=`<p style="font-size:0.68em;color:#888;margin:6px 0">Reduced Motion turns off parallax, critters & weather for slower phones.</p>`;
    sp+=`<button class="btn btn-primary clickable" onclick="showSettings=false;render()">Done</button>`;
    ui.innerHTML=`<div class="panel clickable">${sp}</div>`;
    return;
  }
  if(showHelp){
    let hp=`<div style="text-align:center;font-size:1em;font-weight:bold;color:#4dd0e1;margin-bottom:6px">❓ How to Play</div>`;
    hp+=`<div style="font-size:0.74em;color:#ccc;line-height:1.5;text-align:left">
      <b>🎯 Goal:</b> Descend the Crystal Caverns, defeat the Crystal Titan, and grab the Knowledge Crystal.<br><br>
      <b>⚔️ Battles:</b> Solve the math problem, type your answer, then tap <b>Attack!</b> (or tap the screen). Correct hits damage the monster. 3+ in a row = STREAK bonus!<br><br>
      <b>💻 Puzzles:</b> Fill the blank in the code to open locks.<br><br>
      <b>🗺️ Explore:</b> Tap <b>Explore Next Room</b> to travel deeper. Use Potions to heal.<br><br>
      <b>🎵 Settings:</b> Toggle music, sound FX, and Reduced Motion for slower phones.<br><br>
      <b>📤 Win:</b> Beat the Titan to earn the Champion screen — share it with friends!</div>`;
    hp+=`<button class="btn btn-primary clickable" style="margin-top:8px" onclick="showHelp=false;render()">Got it!</button>`;
    ui.innerHTML=`<div class="panel clickable">${hp}</div>`;
    return;
  }
  ui.innerHTML=hud+`<div class="panel clickable">${panel}</div>`;
  const ans=document.getElementById('answer');
  if(ans)setTimeout(()=>ans.focus(),100);
}

function doAnswer(){const v=document.getElementById('answer').value;if(v){const rt=(performance.now()-questionStart)/1000;api('answer',{answer:v,response_time:Math.max(0,Math.min(rt,10))})}}
function doShop(c){api('shop',{choice:c})}
function resumeGame(){if(!loadOffline())return;state=OFFLINE_G;gameMode=state.mode||'explore';render();}
function clearSave(){try{localStorage.removeItem('cq_sid');}catch(e){}savedSID=null;render();}
function hasLocalSave(){try{return !!localStorage.getItem('cq_offline');}catch(e){return false;}}
function localSaveRoom(){try{return (JSON.parse(localStorage.getItem('cq_offline')||'{}').rooms_cleared||0)+1;}catch(e){return 0;}}
function continueGame(){try{const st=JSON.parse(localStorage.getItem('cq_offline'));if(!st)return;OFFLINE_G=st;state=st;gameMode=st.mode||'explore';if(!gameMode||gameMode==='title'){gameMode='explore';}render();}catch(e){console.error(e);}}
function confirmNewGame(){
  const nm=(document.getElementById('name')&&document.getElementById('name').value)||'Hero';
  if(hasLocalSave()){
    const r=confirm('Start a NEW adventure? This erases your saved progress (Room '+localSaveRoom()+').');
    if(!r) return;
  }
  api('start',{name:nm,difficulty:selDiff,class:selClass});
}
function autoResumeIfSaved(){
  try{ if(hasLocalSave() && gameMode==='title'){ continueGame(); } }catch(e){console.error(e);}
}


function badgeRow(){const m={firstblood:'🩸',streak:'🔥',puzzle:'💻',explorer:'🗺️',champion:'👑'};let s='';for(const k in m){if(badges[k])s+=m[k];}return s||'—';}
function shareVictory(){
  try{
    const cvs=document.getElementById('game').querySelector('canvas');
    const url=cvs.toDataURL('image/png');
    fetch(url).then(x=>x.blob()).then(blob=>{
      const f=new File([blob],'codequest-victory.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'CodeQuest Victory!',text:(state?state.name:'Hero')+' became Champion of the Crystal Caverns!'});
      }else{const a=document.createElement('a');a.href=url;a.download='codequest-victory.png';a.click();}
    });
  }catch(e){console.error('share failed',e);const a=document.createElement('a');a.href=document.getElementById('game').querySelector('canvas').toDataURL('image/png');a.download='codequest-victory.png';a.click();}
}
// === BEST RUN (localStorage) ===
function loadBest(){try{const b=localStorage.getItem('cq_best');if(b){const o=JSON.parse(b);if(o&&typeof o.rooms==='number')bestRun=o;}}catch(e){}}
function loadBadges(){try{const b=localStorage.getItem('cq_badges');if(b){const o=JSON.parse(b);if(o&&typeof o==='object')badges=o;}}catch(e){}}
function saveBadges(){try{localStorage.setItem('cq_badges',JSON.stringify(badges));}catch(e){}}
function earnBadge(id,name){if(badges[id])return;badges[id]=true;saveBadges();badgeMsg='🏅 '+name;badgeMsgLife=1;sfxCorrect();}
function saveBest(rooms,level){try{if(rooms>bestRun.rooms||(rooms===bestRun.rooms&&level>bestRun.level)){bestRun={rooms,level};localStorage.setItem('cq_best',JSON.stringify(bestRun));}}catch(e){}}
// Touch: tap the canvas during a fight to focus/submit answer (one-thumb play)
if(cv){cv.style.touchAction='manipulation';cv.addEventListener('pointerdown',()=>{
  if(gameMode==='battle'||gameMode==='boss'){const a=document.getElementById('answer');if(a){a.focus();if(a.value)doAnswer();}}
});}
loadBest();
loadBadges();
try{savedSID=localStorage.getItem('cq_sid');}catch(e){}
loadSettings();
render();
autoResumeIfSaved();

</script>
</body>
</html>
